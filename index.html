<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Military Map – MIL-STD-2525</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; }

    #app { display: flex; height: 100vh; }

    /* ── Sidebar ──────────────────────────────────────── */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #161b22;
      border-right: 1px solid #30363d;
      display: flex;
      flex-direction: column;
      color: #e6edf3;
    }

    #sidebar-header {
      background: #0d3750;
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 2px solid #1f6f8b;
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #79c0ff;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 9px 2px;
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      cursor: pointer;
      color: #8b949e;
      transition: all 0.12s;
    }

    .tab-btn:hover { color: #e6edf3; background: #1c2128; }

    .tab-btn.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #1c2128; }

    /* affiliation color accents */
    .tab-btn[data-affil="F"].active { color: #3fb950; border-bottom-color: #3fb950; }
    .tab-btn[data-affil="H"].active { color: #f85149; border-bottom-color: #f85149; }
    .tab-btn[data-affil="N"].active { color: #d29922; border-bottom-color: #d29922; }
    .tab-btn[data-affil="U"].active { color: #a5d6ff; border-bottom-color: #a5d6ff; }

    #palette {
      flex: 1;
      overflow-y: auto;
      padding: 6px 8px 12px;
      scrollbar-width: thin;
      scrollbar-color: #30363d #161b22;
    }

    #palette::-webkit-scrollbar { width: 5px; }
    #palette::-webkit-scrollbar-track { background: #161b22; }
    #palette::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    .cat-label {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #484f58;
      padding: 10px 4px 4px;
    }

    .sym-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      margin-bottom: 2px;
      border-radius: 5px;
      cursor: grab;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      user-select: none;
    }

    .sym-item:hover { background: #1c2128; border-color: #30363d; }
    .sym-item.dragging { opacity: 0.4; cursor: grabbing; }
    .sym-icon { flex-shrink: 0; display: flex; align-items: center; }
    .sym-name { font-size: 11.5px; color: #c9d1d9; line-height: 1.2; }

    #sidebar-footer {
      padding: 9px 14px;
      border-top: 1px solid #30363d;
      font-size: 10px;
      color: #484f58;
      text-align: center;
      flex-shrink: 0;
    }

    /* ── Map ──────────────────────────────────────────── */
    #map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    #drop-zone {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: none;
      cursor: crosshair;
    }

    #drop-zone.active {
      display: block;
      background: rgba(88, 166, 255, 0.04);
      outline: 2px dashed rgba(88, 166, 255, 0.35);
      outline-offset: -4px;
    }

    #drop-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 55, 80, 0.92);
      color: #79c0ff;
      padding: 10px 22px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.8px;
      pointer-events: none;
      border: 1px solid #1f6f8b;
      white-space: nowrap;
    }

    #api-key-notice {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(180, 30, 30, 0.94);
      color: #ffd;
      padding: 10px 18px;
      border-radius: 6px;
      font-size: 11.5px;
      text-align: center;
      line-height: 1.55;
      max-width: 460px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }

    #api-key-notice code {
      background: rgba(255,255,255,0.15);
      padding: 1px 5px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ────────────────────────────────────────────── -->
  <div id="sidebar">
    <div id="sidebar-header">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="18" height="18" rx="2" stroke="#79c0ff" stroke-width="1.5"/>
        <path d="M10 4v12M4 10h12" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h1>MIL-STD-2525</h1>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-affil="F">Friendly</button>
      <button class="tab-btn"        data-affil="H">Hostile</button>
      <button class="tab-btn"        data-affil="N">Neutral</button>
      <button class="tab-btn"        data-affil="U">Unknown</button>
    </div>

    <div id="palette"></div>

    <div id="sidebar-footer">Drag a symbol onto the map to place it</div>
  </div>

  <!-- ── Map ───────────────────────────────────────────────── -->
  <div id="map-wrap">
    <div id="map"></div>
    <div id="drop-zone">
      <div id="drop-hint">Drop to Place Unit</div>
    </div>
  </div>

</div>

<!-- milsymbol – MIL-STD-2525 / APP-6 SVG renderer -->
<script src="https://cdn.jsdelivr.net/npm/milsymbol@2.2.0/dist/milsymbol.js"></script>

<script>
// ────────────────────────────────────────────────────────────────
// Symbol catalogue
// Use '$' as the affiliation placeholder (replaced at render time)
// SIDC format: 15-char MIL-STD-2525C
// ────────────────────────────────────────────────────────────────
const SYMBOL_DEFS = [
  // Ground Combat
  { cat: 'Ground Combat' },
  { sidc: 'S$GPUCI--------', label: 'Infantry' },
  { sidc: 'S$GPUCA--------', label: 'Armor' },
  { sidc: 'S$GPUCF--------', label: 'Field Artillery' },
  { sidc: 'S$GPUCR--------', label: 'Reconnaissance' },
  { sidc: 'S$GPUCE--------', label: 'Engineer' },
  { sidc: 'S$GPUCAA-------', label: 'Air Defense Artillery' },
  { sidc: 'S$GPUCIZ-------', label: 'Mech. Infantry' },
  { sidc: 'S$GPUCAT-------', label: 'Anti-Tank' },
  { sidc: 'S$GPUCIM-------', label: 'Mortar' },
  // Command & Control
  { cat: 'Command & Control' },
  { sidc: 'S$GPUH---------', label: 'HQ / Command Post' },
  { sidc: 'S$GPUHI--------', label: 'HQ Infantry' },
  { sidc: 'S$GPUHA--------', label: 'HQ Armor' },
  // Aviation
  { cat: 'Aviation' },
  { sidc: 'S$APMFF--------', label: 'Fighter' },
  { sidc: 'S$APMFH--------', label: 'Attack Helicopter' },
  { sidc: 'S$APMFU--------', label: 'Utility Helicopter' },
  { sidc: 'S$APMFB--------', label: 'Bomber' },
  { sidc: 'S$APMFD--------', label: 'UAV / Drone' },
  // Combat Service Support
  { cat: 'Combat Service Support' },
  { sidc: 'S$GPUSS--------', label: 'Supply' },
  { sidc: 'S$GPUSM--------', label: 'Maintenance' },
  { sidc: 'S$GPUSD--------', label: 'Medical' },
  { sidc: 'S$GPUST--------', label: 'Transportation' },
  // Intelligence / ISR
  { cat: 'Intelligence / ISR' },
  { sidc: 'S$GPUEO--------', label: 'Observation Post' },
  { sidc: 'S$GPESR--------', label: 'Radar' },
];

// ────────────────────────────────────────────────────────────────
// State
// ────────────────────────────────────────────────────────────────
let map         = null;
let currentAffil = 'F';
let dragSidc    = null;
let dragLabel   = null;
let uidCounter  = 0;
const placed    = [];   // { uid, marker, infoWin }

// ────────────────────────────────────────────────────────────────
// Palette rendering
// ────────────────────────────────────────────────────────────────
function buildPalette(affil) {
  const container = document.getElementById('palette');
  container.innerHTML = '';

  SYMBOL_DEFS.forEach(def => {
    if (def.cat) {
      const el = document.createElement('div');
      el.className = 'cat-label';
      el.textContent = def.cat;
      container.appendChild(el);
      return;
    }

    const sidc = def.sidc.replace('$', affil);
    let svgHtml = '<svg width="36" height="36"></svg>';
    try {
      svgHtml = new ms.Symbol(sidc, { size: 36 }).asSVG();
    } catch (_) {}

    const item = document.createElement('div');
    item.className = 'sym-item';
    item.draggable = true;
    item.dataset.sidc  = sidc;
    item.dataset.label = def.label;
    item.innerHTML = `<div class="sym-icon">${svgHtml}</div><span class="sym-name">${def.label}</span>`;

    item.addEventListener('dragstart', e => {
      dragSidc  = sidc;
      dragLabel = def.label;
      item.classList.add('dragging');
      document.getElementById('drop-zone').classList.add('active');
      e.dataTransfer.effectAllowed = 'copy';
      // Use the symbol SVG as the drag image
      const svgEl = item.querySelector('svg');
      if (svgEl) {
        e.dataTransfer.setDragImage(svgEl,
          svgEl.width.baseVal.value / 2,
          svgEl.height.baseVal.value / 2);
      }
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      document.getElementById('drop-zone').classList.remove('active');
    });

    container.appendChild(item);
  });
}

// ────────────────────────────────────────────────────────────────
// Coordinate conversion: client pixel → LatLng
// ────────────────────────────────────────────────────────────────
function clientXYtoLatLng(clientX, clientY) {
  const mapDiv   = map.getDiv();
  const rect     = mapDiv.getBoundingClientRect();
  const x        = clientX - rect.left;
  const y        = clientY - rect.top;
  const proj     = map.getProjection();
  const center   = proj.fromLatLngToPoint(map.getCenter());
  const scale    = Math.pow(2, map.getZoom());
  const worldPt  = new google.maps.Point(
    center.x + (x - mapDiv.offsetWidth  / 2) / scale,
    center.y + (y - mapDiv.offsetHeight / 2) / scale
  );
  return proj.fromPointToLatLng(worldPt);
}

// ────────────────────────────────────────────────────────────────
// Place a symbol marker on the map
// ────────────────────────────────────────────────────────────────
function placeMarker(latLng, sidc, label) {
  const uid = ++uidCounter;
  const sym = new ms.Symbol(sidc, { size: 44 });
  const anc = sym.getAnchor();

  const marker = new google.maps.Marker({
    position:  latLng,
    map:       map,
    icon: {
      url:    'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(sym.asSVG()),
      anchor: new google.maps.Point(anc.x, anc.y),
    },
    title:     label,
    draggable: true,
    zIndex:    uid,
  });

  const infoWin = new google.maps.InfoWindow();

  function refreshInfo() {
    const pos = marker.getPosition();
    infoWin.setContent(`
      <div style="font-family:Arial,sans-serif;min-width:170px;padding:2px 0">
        <div style="font-weight:700;font-size:13px;margin-bottom:3px">${label}</div>
        <div style="font-size:10px;color:#888;margin-bottom:7px;font-family:monospace">${sidc}</div>
        <div style="font-size:11px;margin-bottom:1px">Lat: ${pos.lat().toFixed(6)}</div>
        <div style="font-size:11px;margin-bottom:9px">Lng: ${pos.lng().toFixed(6)}</div>
        <button onclick="window.__milRemove(${uid})"
          style="padding:4px 12px;background:#d73a49;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600">
          Remove
        </button>
      </div>
    `);
  }

  marker.addListener('click',    () => { refreshInfo(); infoWin.open(map, marker); });
  marker.addListener('dragend',  refreshInfo);

  refreshInfo();
  placed.push({ uid, marker, infoWin });
}

// Remove marker by uid (called from InfoWindow button)
window.__milRemove = function(uid) {
  const idx = placed.findIndex(m => m.uid === uid);
  if (idx < 0) return;
  placed[idx].infoWin.close();
  placed[idx].marker.setMap(null);
  placed.splice(idx, 1);
};

// ────────────────────────────────────────────────────────────────
// Drop zone – sits over the map and captures drag events
// The overlay only becomes visible/interactive during a drag,
// which prevents Google Maps from swallowing the drop event.
// ────────────────────────────────────────────────────────────────
const dropZone = document.getElementById('drop-zone');

dropZone.addEventListener('dragover', e => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});

dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('active');
  if (!dragSidc || !map) return;
  placeMarker(clientXYtoLatLng(e.clientX, e.clientY), dragSidc, dragLabel);
  dragSidc  = null;
  dragLabel = null;
});

// ────────────────────────────────────────────────────────────────
// Tab switching
// ────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentAffil = btn.dataset.affil;
    buildPalette(currentAffil);
  });
});

// ────────────────────────────────────────────────────────────────
// Google Maps initialisation (called by the script tag below)
// ────────────────────────────────────────────────────────────────
window.initMap = function () {
  map = new google.maps.Map(document.getElementById('map'), {
    center:           { lat: 36.85, lng: -76.29 },
    zoom:             11,
    mapTypeId:        'terrain',
    gestureHandling:  'greedy',
    mapTypeControl:   true,
    streetViewControl: false,
    fullscreenControl: true,
    mapTypeControlOptions: {
      style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
      position: google.maps.ControlPosition.TOP_RIGHT,
    },
  });

  buildPalette('F');
};

// Show a notice if the API key is still the placeholder
(function checkKey() {
  const script = document.currentScript ||
    [...document.querySelectorAll('script[src*="maps.googleapis"]')].pop();
  const src = script ? script.src : '';
  if (!src || src.includes('YOUR_GOOGLE_MAPS_API_KEY') || src.includes('key=&')) {
    const notice = document.createElement('div');
    notice.id = 'api-key-notice';
    notice.innerHTML = `
      <strong>Google Maps API key required.</strong><br>
      Replace <code>YOUR_GOOGLE_MAPS_API_KEY</code> in <code>index.html</code>
      (last &lt;script&gt; tag) with your key from
      <a href="https://console.cloud.google.com/google/maps-apis" target="_blank"
         style="color:#ffd">Google Cloud Console</a>.
    `;
    document.getElementById('map-wrap').appendChild(notice);
  }
})();
</script>

<!--
  Replace YOUR_GOOGLE_MAPS_API_KEY with your key from:
  https://console.cloud.google.com/google/maps-apis/overview
  Required APIs: Maps JavaScript API
-->
<script async defer
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
</script>

</body>
</html>
