<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>ARMY AI PLANNER — OP IRON SENTINEL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07090e;--glass:rgba(7,9,14,.92);--border:rgba(255,255,255,.07);
  --green:#10b981;--blue:#3b82f6;--red:#ef4444;--amber:#f59e0b;
  --text:#f0f4f8;--sub:#94a3b8;--muted:#475569;
}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;overflow:hidden}

/* ── LAYOUT ─────────────────────────────────────────── */
#app{display:grid;grid-template-rows:52px 1fr 108px;height:100vh}
#workspace{display:grid;grid-template-columns:164px 1fr 300px;overflow:hidden;position:relative}

/* ── TOPBAR ─────────────────────────────────────────── */
#topbar{
  display:flex;align-items:center;gap:20px;padding:0 20px;
  background:var(--glass);border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);z-index:1000
}
.op-dot{width:8px;height:8px;border-radius:50%;background:var(--green);
  box-shadow:0 0 8px var(--green);animation:glow 2s infinite}
@keyframes glow{0%,100%{opacity:1}50%{opacity:.35}}
.op-name{font-size:14px;font-weight:700;letter-spacing:.06em}
.op-class{font-size:9px;color:var(--red);letter-spacing:.12em;font-weight:700;margin-top:1px}
.modes{display:flex;gap:2px;background:rgba(255,255,255,.04);padding:4px;
  border-radius:8px;border:1px solid var(--border);margin-left:12px}
.mode-btn{
  padding:5px 18px;border:none;background:none;color:var(--sub);
  cursor:pointer;border-radius:6px;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;transition:all .2s;font-family:inherit
}
.mode-btn:hover{color:var(--text);background:rgba(255,255,255,.05)}
.mode-btn.active{background:var(--green);color:#000;box-shadow:0 0 16px rgba(16,185,129,.35)}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:16px}
.clock{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;
  font-family:'Courier New',monospace;letter-spacing:.05em}
.cl-badge{font-size:9px;color:var(--red);border:1px solid rgba(239,68,68,.4);
  padding:2px 8px;border-radius:4px;letter-spacing:.1em;font-weight:700}

/* ── LEFT PANEL ─────────────────────────────────────── */
#left-panel{
  background:var(--glass);border-right:1px solid var(--border);
  backdrop-filter:blur(12px);display:flex;flex-direction:column;overflow:hidden
}
.lp-head{padding:10px 12px 6px;font-size:9px;text-transform:uppercase;
  letter-spacing:.14em;color:var(--muted);border-bottom:1px solid var(--border)}
#lp-body{flex:1;overflow-y:auto;padding:10px 8px}

/* unit card */
.ucard{
  border:1.5px solid rgba(59,130,246,.45);border-radius:7px;
  padding:8px 8px 6px;margin-bottom:7px;cursor:grab;
  background:rgba(59,130,246,.07);user-select:none;transition:all .2s
}
.ucard:hover{border-color:var(--blue);background:rgba(59,130,246,.14);transform:translateX(3px)}
.ucard:active{cursor:grabbing}
.ucard.placed{opacity:.3;cursor:default;pointer-events:none}
.nato{width:100%;margin-bottom:5px}
.nato svg{width:100%;height:auto;display:block}
.ucard-name{font-size:11px;font-weight:700;text-align:center;color:var(--text)}
.ucard-sub{font-size:9px;color:var(--sub);text-align:center;margin-top:2px}

/* intel / dp list items */
.list-item{
  display:flex;gap:8px;align-items:flex-start;padding:8px;border-radius:7px;
  border:1px solid var(--border);margin-bottom:6px;
  background:rgba(255,255,255,.02);cursor:pointer;transition:all .15s
}
.list-item:hover{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.05)}
.list-item-ico{font-size:14px;line-height:1;flex-shrink:0;margin-top:1px}
.list-item-name{font-size:11px;font-weight:600;color:var(--text)}
.list-item-sub{font-size:9px;color:var(--sub);margin-top:2px}

/* ── MAP ────────────────────────────────────────────── */
#map-wrap{position:relative}
#map{width:100%;height:100%}
.leaflet-container{background:#0d1219}
.leaflet-tile-pane{filter:saturate(.65) brightness(.72) contrast(1.05)}
.leaflet-control-zoom{border:1px solid var(--border)!important;border-radius:8px!important;overflow:hidden;box-shadow:none!important}
.leaflet-control-zoom a{background:var(--glass)!important;color:var(--text)!important;border:none!important;backdrop-filter:blur(8px)}
.leaflet-control-zoom a:hover{background:rgba(255,255,255,.1)!important}
.leaflet-popup-content-wrapper{background:rgba(7,9,14,.95);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:10px;color:var(--text);box-shadow:0 8px 32px rgba(0,0,0,.7)}
.leaflet-popup-tip{background:rgba(7,9,14,.95)}
.leaflet-popup-content{margin:12px 16px;font-size:12px}
.leaflet-attribution-flag{display:none!important}
.leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:var(--muted)!important;font-size:9px!important;border-radius:4px!important}

/* map drop glow */
#map-wrap.drop-active::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:500;
  box-shadow:inset 0 0 40px rgba(59,130,246,.25);
  border:2px solid rgba(59,130,246,.4)
}

/* map legend */
#legend{
  position:absolute;bottom:16px;left:12px;z-index:500;
  background:var(--glass);border:1px solid var(--border);
  border-radius:10px;backdrop-filter:blur(12px);padding:10px 14px
}
.leg-row{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:10px;color:var(--sub)}
.leg-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.leg-line{width:18px;height:2px;flex-shrink:0}

/* map unit markers */
.mu{display:flex;flex-direction:column;align-items:center;cursor:pointer}
.mu-sym{width:34px;height:26px;background:#1d4ed8;border:2px solid #93c5fd;
  border-radius:3px;display:flex;align-items:center;justify-content:center}
.mu-sym svg{width:22px;height:16px}
.mu-lbl{font-size:9px;font-weight:700;color:#fff;background:rgba(0,0,0,.8);
  padding:1px 5px;margin-top:2px;border-radius:2px;white-space:nowrap;letter-spacing:.04em}

/* pl label */
.pl-lbl{padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;
  font-family:'Courier New',monospace;white-space:nowrap;backdrop-filter:blur(4px)}

/* ── AI PANEL ────────────────────────────────────────── */
#ai-panel{
  background:var(--glass);border-left:1px solid var(--border);
  backdrop-filter:blur(12px);display:flex;flex-direction:column
}
.ai-hdr{
  padding:13px 16px 11px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;flex-shrink:0
}
.ai-hdr-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:glow 2s infinite}
.ai-hdr-title{font-size:12px;font-weight:700;color:var(--text)}
.ai-hdr-sub{font-size:10px;color:var(--muted);margin-top:1px}
#ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.amsg-role{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:4px}
.abubble{padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.65}
.abubble.ai{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.18);color:var(--text)}
.abubble.user{background:rgba(59,130,246,.09);border:1px solid rgba(59,130,246,.2);color:var(--text)}
.abubble.ctx{background:rgba(245,158,11,.07);border:1px solid rgba(245,158,11,.2);color:var(--amber);font-size:11px}
.athinking{display:flex;gap:5px;padding:10px 12px}
.td{width:7px;height:7px;border-radius:50%;background:var(--green);opacity:.4;animation:tb .9s infinite}
.td:nth-child(2){animation-delay:.15s}.td:nth-child(3){animation-delay:.3s}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.ai-quick{padding:9px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.aq-btn{
  padding:7px 11px;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:7px;color:var(--sub);cursor:pointer;font-size:11px;
  text-align:left;transition:all .15s;font-family:inherit
}
.aq-btn:hover{border-color:var(--green);color:var(--text);background:rgba(16,185,129,.06)}
.ai-inp-row{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.ai-inp{
  flex:1;background:rgba(255,255,255,.04);border:1px solid var(--border);
  border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;
  padding:8px 12px;outline:none;resize:none;min-height:36px;max-height:80px;transition:border-color .15s
}
.ai-inp:focus{border-color:rgba(16,185,129,.5)}
.ai-inp::placeholder{color:var(--muted)}
.ai-send{
  width:36px;height:36px;border-radius:8px;background:var(--green);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:background .15s;flex-shrink:0
}
.ai-send:hover{background:#059669}
.ai-send:disabled{opacity:.4;cursor:not-allowed}
.ai-send svg{width:15px;height:15px;fill:white}

/* ── TIMELINE ────────────────────────────────────────── */
#timeline{
  background:var(--glass);border-top:1px solid var(--border);
  backdrop-filter:blur(12px);display:flex;flex-direction:column;overflow:hidden
}
.tl-hdr{
  display:flex;align-items:center;gap:14px;padding:5px 16px;
  border-bottom:1px solid var(--border);flex-shrink:0
}
.tl-ttl{font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.tl-leg{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--sub)}
.tl-leg-sq{width:8px;height:8px;border-radius:2px}
.tl-btns{margin-left:auto;display:flex;gap:6px}
.tl-btn{
  width:26px;height:26px;border-radius:5px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);color:var(--sub);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s
}
.tl-btn:hover{border-color:var(--green);color:var(--green)}
.tl-btn.on{background:var(--green);border-color:var(--green);color:#000}
#tl-track{
  flex:1;overflow-x:auto;overflow-y:hidden;
  scrollbar-width:thin;scrollbar-color:var(--muted) transparent;position:relative
}
#tl-inner{position:relative;height:100%;display:flex}
.tl-day{
  flex-shrink:0;width:120px;height:100%;
  border-right:1px solid rgba(255,255,255,.05);position:relative
}
.tl-day-lbl{
  font-size:9px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);padding:5px 8px;position:relative;z-index:2
}
.phase-blk{
  position:absolute;top:22px;height:calc(100% - 30px);
  border-radius:6px;display:flex;align-items:center;padding:0 10px;
  font-size:10px;font-weight:700;cursor:grab;white-space:nowrap;
  user-select:none;box-shadow:0 2px 10px rgba(0,0,0,.5);
  transition:opacity .15s,filter .15s;z-index:3
}
.phase-blk:hover{filter:brightness(1.15)}
.phase-blk:active{cursor:grabbing;filter:brightness(1.2)}
.ph-resize{
  position:absolute;right:0;top:0;bottom:0;width:8px;
  cursor:col-resize;background:rgba(0,0,0,.25);border-radius:0 6px 6px 0
}
#tl-now{
  position:absolute;top:0;bottom:0;width:2px;
  background:var(--green);box-shadow:0 0 10px var(--green);
  z-index:10;pointer-events:none;transition:left .1s linear
}
#tl-now::before{
  content:'NOW';position:absolute;top:5px;left:5px;
  background:var(--green);color:#000;font-size:8px;font-weight:900;
  padding:1px 4px;border-radius:2px;letter-spacing:.06em
}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:2px}
</style>
</head>
<body>
<div id="app">

<!-- TOPBAR -->
<header id="topbar">
  <div style="display:flex;align-items:center;gap:10px">
    <div class="op-dot"></div>
    <div><div class="op-name">OP IRON SENTINEL</div><div class="op-class">SECRET // NOFORN</div></div>
  </div>
  <div class="modes">
    <button class="mode-btn active" data-mode="analyze" onclick="setMode('analyze')">Analyze</button>
    <button class="mode-btn" data-mode="plan" onclick="setMode('plan')">Plan</button>
    <button class="mode-btn" data-mode="wargame" onclick="setMode('wargame')">Wargame</button>
    <button class="mode-btn" data-mode="order" onclick="setMode('order')">Order</button>
  </div>
  <div class="topbar-r">
    <span class="cl-badge">SECRET</span>
    <span class="clock" id="clock">000000Z</span>
  </div>
</header>

<!-- WORKSPACE -->
<div id="workspace">

  <!-- LEFT PANEL -->
  <div id="left-panel">
    <div class="lp-head" id="lp-head">Intelligence</div>
    <div id="lp-body"></div>
  </div>

  <!-- MAP -->
  <div id="map-wrap">
    <div id="map"></div>
    <div id="legend">
      <div class="leg-row"><div class="leg-dot" style="background:#ef4444"></div>Enemy force</div>
      <div class="leg-row"><div class="leg-dot" style="background:#3b82f6"></div>Friendly unit</div>
      <div class="leg-row"><div class="leg-dot" style="background:#f59e0b;border-radius:0;transform:rotate(45deg)"></div>Objective</div>
      <div class="leg-row"><div class="leg-line" style="background:#f59e0b;border-top:2px dashed #f59e0b;height:0"></div>Phase line</div>
      <div class="leg-row"><div class="leg-line" style="background:#3b82f6;height:2px"></div>Route</div>
    </div>
  </div>

  <!-- AI PANEL -->
  <div id="ai-panel">
    <div class="ai-hdr">
      <div class="ai-hdr-dot"></div>
      <div><div class="ai-hdr-title">AI Planning Assistant</div><div class="ai-hdr-sub">Click map elements for analysis</div></div>
    </div>
    <div id="ai-msgs"></div>
    <div class="ai-quick" id="ai-quick"></div>
    <div class="ai-inp-row">
      <textarea class="ai-inp" id="ai-inp" placeholder="Ask about the operation…" rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="ai-send" id="ai-send-btn" onclick="sendMsg()">
        <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
      </button>
    </div>
  </div>

</div><!-- /#workspace -->

<!-- TIMELINE -->
<div id="timeline">
  <div class="tl-hdr">
    <span class="tl-ttl">Operation Timeline</span>
    <span class="tl-leg"><span class="tl-leg-sq" style="background:#6366f1"></span>Planning</span>
    <span class="tl-leg"><span class="tl-leg-sq" style="background:#10b981"></span>Movement</span>
    <span class="tl-leg"><span class="tl-leg-sq" style="background:#ef4444"></span>Action</span>
    <span class="tl-leg"><span class="tl-leg-sq" style="background:#f59e0b"></span>Consolidation</span>
    <div class="tl-btns">
      <button class="tl-btn" id="play-btn" onclick="tlToggle()" title="Play/Pause">▶</button>
      <button class="tl-btn" onclick="tlReset()" title="Reset">↺</button>
    </div>
  </div>
  <div id="tl-track"><div id="tl-inner"></div></div>
</div>

</div><!-- /#app -->
<script>
/* ═══════════════════════════════════════════════
   CLOCK
═══════════════════════════════════════════════ */
function tick(){
  const n=new Date(),p=v=>String(v).padStart(2,'0');
  document.getElementById('clock').textContent=`${p(n.getUTCDate())}${p(n.getUTCHours())}${p(n.getUTCMinutes())}Z`;
}
tick();setInterval(tick,1000);

/* ═══════════════════════════════════════════════
   MAP
═══════════════════════════════════════════════ */
window.map=L.map('map',{zoomControl:true,attributionControl:true});
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{
  maxZoom:16,attribution:'© OpenTopoMap'
}).addTo(map);
map.setView([46.520,13.020],12);

const G={          // Layer groups by mode
  always:L.layerGroup().addTo(map),
  analyze:L.layerGroup().addTo(map),
  plan:L.layerGroup(),
  wargame:L.layerGroup(),
  order:L.layerGroup()
};

/* ── helpers ── */
function di(html,size=[40,40],anchor=[20,20]){
  return L.divIcon({html,className:'',iconSize:size,iconAnchor:anchor});
}
function addTo(mode,...layers){layers.forEach(l=>G[mode].addLayer(l));}

/* ── NATO SVGs ── */
const SYM={
  inf:`<svg viewBox="0 0 40 28" fill="none" stroke="#93c5fd" stroke-width="2">
    <rect x="1" y="1" width="38" height="26" rx="1"/>
    <line x1="1" y1="1" x2="39" y2="27"/><line x1="39" y1="1" x2="1" y2="27"/>
  </svg>`,
  arty:`<svg viewBox="0 0 40 28" fill="none" stroke="#93c5fd" stroke-width="2">
    <rect x="1" y="1" width="38" height="26" rx="1"/>
    <circle cx="20" cy="14" r="7" fill="rgba(59,130,246,.3)"/>
  </svg>`,
  eng:`<svg viewBox="0 0 40 28" fill="none" stroke="#93c5fd" stroke-width="2">
    <rect x="1" y="1" width="38" height="26" rx="1"/>
    <rect x="8" y="7" width="24" height="14" rx="1" fill="rgba(59,130,246,.2)"/>
    <text x="20" y="20" text-anchor="middle" font-size="11" fill="#93c5fd" stroke="none" font-weight="700">E</text>
  </svg>`,
  isr:`<svg viewBox="0 0 40 28" fill="none" stroke="#93c5fd" stroke-width="2">
    <rect x="1" y="1" width="38" height="26" rx="1"/>
    <path d="M10 14 Q20 4 30 14 Q20 24 10 14Z" fill="rgba(59,130,246,.25)"/>
  </svg>`,
};

/* ── Phase lines ── */
function phaseLine(lat,label,color){
  const line=L.polyline([[lat,12.85],[lat,13.25]],
    {color,weight:1.5,dashArray:'7 5',opacity:.75});
  const mk=L.marker([lat,12.88],{
    icon:di(`<div class="pl-lbl" style="background:rgba(0,0,0,.65);border:1px solid ${color};color:${color}">${label}</div>`,[80,20],[0,10]),
    interactive:false
  });
  addTo('always',line,mk);
}
phaseLine(46.508,'PL AMBER','#f59e0b');
phaseLine(46.570,'PL COPPER','#10b981');

/* ── Objective EAGLE ── */
const objEagle=L.marker([46.548,13.055],{
  icon:di(`<div style="width:26px;height:26px;border:2.5px solid #ef4444;
    transform:rotate(45deg);background:rgba(239,68,68,.15);
    box-shadow:0 0 14px rgba(239,68,68,.6);border-radius:2px"></div>`,[26,26],[13,13])
}).on('click',()=>onFeature('obj'));
const objLbl=L.marker([46.553,13.055],{
  icon:di(`<div style="font-size:10px;font-weight:800;color:#ef4444;
    white-space:nowrap;text-shadow:0 1px 4px #000;letter-spacing:.05em">OBJ EAGLE</div>`,[80,14],[0,14]),
  interactive:false
});
addTo('always',objEagle,objLbl);

/* ── Ridge Alpha ── */
const ridgeAlpha=L.marker([46.530,13.025],{
  icon:di(`<div style="width:0;height:0;
    border-left:13px solid transparent;border-right:13px solid transparent;
    border-bottom:20px solid #10b981;filter:drop-shadow(0 0 6px rgba(16,185,129,.6))"></div>`,[26,20],[13,20])
}).on('click',()=>onFeature('ridge'));
const ridgeLbl=L.marker([46.534,13.025],{
  icon:di(`<div style="font-size:9px;font-weight:700;color:#10b981;
    white-space:nowrap;text-shadow:0 1px 3px #000">RIDGE ALPHA</div>`,[90,12],[0,12]),
  interactive:false
});
addTo('always',ridgeAlpha,ridgeLbl);

/* ── Enemy positions ── */
function enemyBP(lat,lng,id){
  const m=L.marker([lat,lng],{
    icon:di(`<div style="width:22px;height:22px;background:#ef4444;
      border:2px solid #fca5a5;border-radius:2px;display:flex;align-items:center;
      justify-content:center;font-size:8px;font-weight:800;color:#fff;
      box-shadow:0 0 12px rgba(239,68,68,.6)">BP</div>`,[22,22],[11,11])
  }).on('click',()=>onFeature('bp'));
  const ring=L.circle([lat,lng],{
    radius:1100,color:'#ef4444',weight:1,dashArray:'5 4',
    opacity:.45,fill:true,fillColor:'#ef4444',fillOpacity:.04
  });
  addTo('always',m);addTo('analyze',ring);
  return m;
}
enemyBP(46.537,13.052,'bp1');
enemyBP(46.552,13.040,'bp2');

/* Enemy CP */
const enCP=L.marker([46.560,13.068],{
  icon:di(`<div style="width:20px;height:20px;background:#7f1d1d;
    border:2px solid #ef4444;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:8px;font-weight:800;color:#fff;
    box-shadow:0 0 10px rgba(239,68,68,.5)">CP</div>`,[20,20],[10,10])
}).on('click',()=>onFeature('cp'));

function uDrag(e,id){e.dataTransfer.setData('uid',id);e.dataTransfer.effectAllowed='copy';}
const mapEl=document.getElementById('map');
const mapWrap=document.getElementById('map-wrap');
mapEl.addEventListener('dragover',e=>{e.preventDefault();mapWrap.classList.add('drop-active');});
mapEl.addEventListener('dragleave',()=>mapWrap.classList.remove('drop-active'));
mapEl.addEventListener('drop',e=>{
  e.preventDefault();mapWrap.classList.remove('drop-active');
  const id=e.dataTransfer.getData('uid');if(!id)return;
  const rect=mapEl.getBoundingClientRect();
  const ll=map.containerPointToLatLng(L.point(e.clientX-rect.left,e.clientY-rect.top));
  placeUnit(id,ll);
});

function placeUnit(id,ll){
  const u=UNITS.find(x=>x.id===id);
  if(!u||u.placed)return;
  u.placed=true;
  const icon=di(`<div class="mu">
    <div class="mu-sym">${SYM[u.type]||SYM.inf}</div>
    <div class="mu-lbl">${u.name}</div>
  </div>`,[40,42],[20,42]);
  const mk=L.marker(ll,{icon,draggable:true}).addTo(map);
  mk.on('click',()=>onFeature('funit',{u}));
  placedMarkers[id]=mk;
  const card=document.getElementById('uc-'+id);
  if(card){card.classList.add('placed');card.draggable=false;}
  const tips={
    aco:'A CO placed. Best suited for the AA2 infiltration — 6km to RIDGE ALPHA, est 4hr movement. Recommend assigning 172 EN for route obstacle clearance.',
    bco:'B CO placed. Position for the AXIS BLUE feint to fix enemy BPs. Coordinate with A BTY for suppression fires before advancing past PL AMBER.',
    cco:'C CO (Air Assault) placed. Verify LZ FALCON is within 8km. SEAD must precede by 35min — abort threshold: ADA active at DP-1.',
    artb:'A BTY placed. Check firing fans clear of 600m NOFIRES around HADITHA. Can suppress RIDGE ALPHA BPs and conduct SEAD on ZSU-23-4 from this position.',
    enco:'172 EN placed. Primary tasks: AA2 route clearance, PL AMBER breach, bridge recon MG 342-887. Task-organize to A CO for Phase I.',
    isr:'ISR Plt placed. Task RQ-7B-1: continuous coverage AXIS BEAR (MDCOA trigger). RQ-7B-2: AA2 route confirmation NLT H-6. EMCON considered.',
  };
  thinking(()=>aiMsg(tips[id]||`${u.name} positioned. Ask me for task analysis or route guidance.`,'ai'));
}

let thinking_timer;
function thinking(cb){
  document.getElementById('ai-send-btn').disabled=true;
  const msgs=document.getElementById('ai-msgs');
  const el=document.createElement('div');
  el.className='athinking';
  el.innerHTML='<div class="td"></div><div class="td"></div><div class="td"></div>';
  msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;
  thinking_timer=setTimeout(()=>{
    el.remove();
    document.getElementById('ai-send-btn').disabled=false;
    cb();
  },800+Math.random()*600);
}

function aiMsg(txt,role){
  const msgs=document.getElementById('ai-msgs');
  const n=new Date(),p=v=>String(v).padStart(2,'0');
  const ts=`${p(n.getUTCHours())}${p(n.getUTCMinutes())}Z`;
  const el=document.createElement('div');
  el.innerHTML=`<div class="amsg-role">${role==='user'?'Planner':role==='ctx'?'System':'AI'} · ${ts}</div>
    <div class="abubble ${role==='user'?'user':role==='ctx'?'ctx':'ai'}">${
      txt.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    }</div>`;
  msgs.appendChild(el);msgs.scrollTop=msgs.scrollHeight;
}

function sendQ(p){aiMsg(p,'user');thinking(()=>aiMsg(matchAI(p),'ai'));}
function sendMsg(){
  const i=document.getElementById('ai-inp');
  const t=i.value.trim();if(!t)return;
  aiMsg(t,'user');i.value='';
  thinking(()=>aiMsg(matchAI(t),'ai'));
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}}

    <div class="tl-day" style="width:${DAY_W}px">
      <div class="tl-day-lbl">${d}</div>
    </div>`).join('');
  // Phase blocks
  PHASES.forEach(p=>{
    const el=document.createElement('div');
    el.className='phase-blk';
    el.style.cssText=`left:${p.dayStart*DAY_W+4}px;width:${p.daySpan*DAY_W-8}px;background:${p.color};
      color:${['#10b981','#6366f1'].includes(p.color)?'#fff':'#000'}`;
    el.draggable=true;
    el.innerHTML=`${p.label}<div class="ph-resize"></div>`;
    el.addEventListener('dragstart',e=>{
      e.dataTransfer.setData('phase',p.label);
      e.dataTransfer.effectAllowed='move';
    });
    inner.appendChild(el);
    // resize handle
    const rh=el.querySelector('.ph-resize');
    let resizing=false,startX=0,startW=0;
    rh.addEventListener('mousedown',e=>{
      resizing=true;startX=e.clientX;startW=el.offsetWidth;
      e.stopPropagation();e.preventDefault();
    });
    document.addEventListener('mousemove',e=>{
      if(!resizing)return;
      const delta=e.clientX-startX;
      const newW=Math.max(60,startW+delta);
      el.style.width=newW+'px';
    });
    document.addEventListener('mouseup',()=>{resizing=false;});
  });
  // Phase drop reorder
  inner.addEventListener('dragover',e=>{e.preventDefault();});
  inner.addEventListener('drop',e=>{
    e.preventDefault();
    const phase=e.dataTransfer.getData('phase');
    if(!phase)return;
    const rect=inner.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const day=Math.round(x/DAY_W);
    const el=Array.from(inner.querySelectorAll('.phase-blk')).find(b=>b.textContent.trim().startsWith(phase));
    if(el)el.style.left=`${day*DAY_W+4}px`;
  });
  // NOW indicator
  const nowEl=document.createElement('div');
  nowEl.id='tl-now';nowEl.style.left=(2*DAY_W)+'px';
  inner.appendChild(nowEl);
}
buildTimeline();

/* timeline playback */
let playing=false,nowPx=2*DAY_W,playIv;
function tlToggle(){
  playing=!playing;
  const b=document.getElementById('play-btn');
  b.textContent=playing?'⏸':'▶';b.classList.toggle('on',playing);
  if(playing){
    playIv=setInterval(()=>{
      nowPx+=1.5;
      if(nowPx>DAYS.length*DAY_W)nowPx=0;
      const el=document.getElementById('tl-now');
      if(el)el.style.left=nowPx+'px';
      // scroll to keep now visible
      const track=document.getElementById('tl-track');
      if(nowPx>track.scrollLeft+track.clientWidth-60)track.scrollLeft+=20;
    },40);
  }else clearInterval(playIv);
}
function tlReset(){
  playing=false;clearInterval(playIv);nowPx=2*DAY_W;
  const b=document.getElementById('play-btn');b.textContent='▶';b.classList.remove('on');
  const el=document.getElementById('tl-now');if(el)el.style.left=nowPx+'px';
  document.getElementById('tl-track').scrollLeft=0;
}
