<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Military Map – MIL-STD-2525</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; }
    #app { display: flex; height: 100vh; }

    /* ── Sidebar ─────────────────────────────────────────────── */
    #sidebar {
      width: 264px; min-width: 264px;
      background: #161b22; border-right: 1px solid #30363d;
      display: flex; flex-direction: column; color: #e6edf3;
    }

    #sidebar-header {
      background: #0d3750; padding: 12px 16px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 2px solid #1f6f8b; flex-shrink: 0;
    }
    #sidebar-header h1 {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.5px; color: #79c0ff;
    }

    /* Mode tabs: Units | Graphics | Objects */
    #mode-tabs {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      background: #0d1117; border-bottom: 1px solid #30363d; flex-shrink: 0;
    }
    .mode-tab {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 10px 4px; font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.8px; cursor: pointer; color: #8b949e; transition: all 0.12s;
    }
    .mode-tab:hover { color: #e6edf3; background: #161b22; }
    .mode-tab.active { color: #58a6ff; border-bottom-color: #58a6ff; background: #161b22; }

    /* Panels */
    .panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .panel.active { display: flex; }

    /* Affiliation tabs (shared style) */
    .affil-tabs {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #30363d; flex-shrink: 0;
    }
    .tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 8px 2px; font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.4px; cursor: pointer; color: #8b949e; transition: all 0.12s;
    }
    .tab-btn:hover { color: #e6edf3; background: #1c2128; }
    .tab-btn.active { background: #1c2128; }
    .tab-btn[data-affil="F"].active { color: #3fb950; border-bottom-color: #3fb950; }
    .tab-btn[data-affil="H"].active { color: #f85149; border-bottom-color: #f85149; }
    .tab-btn[data-affil="N"].active { color: #d29922; border-bottom-color: #d29922; }
    .tab-btn[data-affil="U"].active { color: #a5d6ff; border-bottom-color: #a5d6ff; }

    /* Recently Used strip */
    #recently-used-wrap {
      padding: 6px 8px 4px; border-bottom: 1px solid #30363d; flex-shrink: 0;
    }
    #recently-used-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: #484f58; margin-bottom: 4px;
    }
    #recently-used-strip {
      display: flex; gap: 4px; overflow-x: auto;
      scrollbar-width: thin; scrollbar-color: #30363d #161b22;
    }
    #recently-used-strip::-webkit-scrollbar { height: 3px; }
    #recently-used-strip::-webkit-scrollbar-track { background: #161b22; }
    #recently-used-strip::-webkit-scrollbar-thumb { background: #30363d; }
    .recent-item {
      flex-shrink: 0; width: 36px; display: flex; flex-direction: column;
      align-items: center; cursor: pointer; padding: 2px; border-radius: 4px;
      border: 1px solid transparent; transition: all 0.1s;
    }
    .recent-item:hover { background: #1c2128; border-color: #30363d; }
    .recent-item span { font-size: 7.5px; color: #8b949e; text-align: center;
      line-height: 1.1; max-width: 34px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Search bar */
    #unit-search-wrap {
      padding: 6px 8px; border-bottom: 1px solid #30363d; flex-shrink: 0;
      display: flex; gap: 4px; align-items: center;
    }
    #unit-search {
      flex: 1; padding: 5px 8px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 4px;
      color: #e6edf3; font-size: 11px; outline: none;
    }
    #unit-search:focus { border-color: #388bfd; }
    #unit-search-clear {
      background: none; border: none; color: #484f58; cursor: pointer;
      font-size: 14px; line-height: 1; padding: 2px 4px; border-radius: 3px;
    }
    #unit-search-clear:hover { color: #e6edf3; }

    /* Scrollable palette */
    .palette {
      flex: 1; overflow-y: auto; padding: 6px 8px 12px;
      scrollbar-width: thin; scrollbar-color: #30363d #161b22;
    }
    .palette::-webkit-scrollbar { width: 5px; }
    .palette::-webkit-scrollbar-track { background: #161b22; }
    .palette::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    .cat-label {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1.2px; color: #484f58; padding: 10px 4px 4px;
    }

    /* Unit symbol items (drag-and-drop) */
    .sym-item {
      display: flex; align-items: center; gap: 10px;
      padding: 5px 8px; margin-bottom: 2px; border-radius: 5px;
      cursor: grab; border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s; user-select: none;
    }
    .sym-item:hover { background: #1c2128; border-color: #30363d; }
    .sym-item.dragging { opacity: 0.4; cursor: grabbing; }

    /* Tactical graphic items (click to draw) */
    .tg-item {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px; margin-bottom: 2px; border-radius: 5px;
      cursor: pointer; border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s; user-select: none;
    }
    .tg-item:hover { background: #1c2128; border-color: #30363d; }
    .tg-item.selected { background: #1c3a5e; border-color: #388bfd; }

    .item-icon { flex-shrink: 0; display: flex; align-items: center; }
    .item-name { font-size: 11.5px; color: #c9d1d9; flex: 1; line-height: 1.2; }

    .type-badge {
      font-size: 8px; font-weight: 700; padding: 1px 5px;
      border-radius: 3px; flex-shrink: 0;
    }
    .badge-pt { background: #1f4a2e; color: #3fb950; }
    .badge-ln { background: #1c3a5e; color: #58a6ff; }
    .badge-ar { background: #3a1f4a; color: #bc8cff; }

    #sidebar-footer {
      padding: 9px 14px; border-top: 1px solid #30363d;
      font-size: 10px; color: #484f58; text-align: center; flex-shrink: 0;
    }

    /* ── Objects Panel ──────────────────────────────────────── */
    #objects-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    #objects-panel.active { display: flex; }

    .obj-group-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px 6px; cursor: pointer; user-select: none;
      border-bottom: 1px solid #21262d;
    }
    .obj-group-header:hover { background: #1c2128; }
    .obj-group-triangle { font-size: 10px; color: #484f58; width: 10px; flex-shrink: 0; }
    .obj-group-title {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #484f58; flex: 1;
    }
    .obj-group-count {
      font-size: 9px; color: #484f58; background: #21262d;
      padding: 1px 5px; border-radius: 8px;
    }
    .obj-group-eye {
      background: none; border: none; color: #484f58; cursor: pointer;
      font-size: 12px; padding: 2px 4px; border-radius: 3px;
    }
    .obj-group-eye:hover { color: #e6edf3; }

    .obj-group-list { overflow: hidden; transition: max-height 0.12s ease-out; }
    .obj-group-list.collapsed { max-height: 0 !important; }

    .obj-row {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; cursor: pointer; border-bottom: 1px solid #21262d;
      transition: background 0.1s;
    }
    .obj-row:hover { background: #1c2128; }
    .obj-row.selected { background: #1c3a5e; border-left: 2px solid #388bfd; }
    .obj-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .obj-name {
      flex: 1; font-size: 11px; color: #c9d1d9;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 130px;
    }
    .obj-name.hidden-obj { text-decoration: line-through; color: #484f58; }
    .obj-type-icon { font-size: 10px; color: #484f58; flex-shrink: 0; }
    .obj-btn {
      background: none; border: none; cursor: pointer;
      font-size: 12px; padding: 2px 4px; border-radius: 3px; color: #484f58;
      flex-shrink: 0;
    }
    .obj-btn:hover { color: #e6edf3; }
    .obj-btn.del:hover { color: #f85149; }

    #objects-list {
      flex: 1; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #30363d #161b22;
    }
    #objects-list::-webkit-scrollbar { width: 5px; }
    #objects-list::-webkit-scrollbar-track { background: #161b22; }
    #objects-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    #objects-footer {
      padding: 8px 12px; border-top: 1px solid #30363d;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    #btn-export-geojson {
      padding: 5px 12px; background: #1c3a5e; color: #58a6ff;
      border: 1px solid #388bfd; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600;
    }
    #btn-export-geojson:hover { background: #0d3750; }
    #objects-total { font-size: 10px; color: #484f58; }

    /* ── Map ──────────────────────────────────────────────────── */
    #map-wrap { flex: 1; position: relative; }
    #map { width: 100%; height: 100%; }

    /* Drop zone for unit drag */
    #drop-zone {
      position: absolute; inset: 0; z-index: 5; display: none; cursor: crosshair;
    }
    #drop-zone.active {
      display: block; background: rgba(88,166,255,0.04);
      outline: 2px dashed rgba(88,166,255,0.35); outline-offset: -4px;
    }
    #drop-hint {
      position: absolute; bottom: 54px; left: 50%; transform: translateX(-50%);
      background: rgba(13,55,80,0.92); color: #79c0ff; padding: 10px 22px;
      border-radius: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.8px;
      pointer-events: none; border: 1px solid #1f6f8b; white-space: nowrap;
    }

    /* Drawing instruction bar */
    #drawing-bar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
      background: rgba(10,16,26,0.96); border-top: 1px solid #388bfd;
      display: none; align-items: center; gap: 14px; padding: 10px 16px;
    }
    #drawing-bar.active { display: flex; }
    #drawing-title { font-size: 12px; font-weight: 700; color: #79c0ff; white-space: nowrap; }
    #drawing-hint  { font-size: 11px; color: #8b949e; flex: 1; }
    #btn-undo {
      padding: 4px 10px; background: #21262d; color: #e3b341;
      border: 1px solid #e3b341; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    #btn-undo:hover { background: rgba(227,179,65,0.12); }
    #btn-finish {
      padding: 4px 10px; background: #21262d; color: #3fb950;
      border: 1px solid #3fb950; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    #btn-finish:hover { background: rgba(63,185,80,0.12); }
    #btn-cancel {
      padding: 4px 10px; background: #21262d; color: #f85149;
      border: 1px solid #f85149; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600; white-space: nowrap;
    }
    #btn-cancel:hover { background: rgba(248,81,73,0.12); }

    /* Name modal */
    #name-modal {
      position: absolute; inset: 0; z-index: 30;
      background: rgba(0,0,0,0.6); display: none;
      align-items: center; justify-content: center;
    }
    #name-modal.open { display: flex; }
    #name-modal-box {
      background: #1c2128; border: 1px solid #388bfd; border-radius: 8px;
      padding: 20px 24px; min-width: 300px; box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    #name-modal-title { font-size: 13px; color: #79c0ff; margin-bottom: 12px; font-weight: 700; }
    #name-input {
      width: 100%; padding: 8px 10px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 5px;
      color: #e6edf3; font-size: 13px; margin-bottom: 14px; outline: none;
    }
    #name-input:focus { border-color: #388bfd; }
    .modal-btns { display: flex; gap: 8px; justify-content: flex-end; }
    .modal-btn {
      padding: 6px 14px; border-radius: 4px; font-size: 12px;
      font-weight: 600; cursor: pointer; border: 1px solid transparent;
    }
    #name-ok   { background: #388bfd; color: #fff; }
    #name-ok:hover { background: #58a6ff; }
    #name-skip { background: none; color: #8b949e; border-color: #30363d; }
    #name-skip:hover { color: #e6edf3; }

    /* API key notice */
    #api-key-notice {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 20; background: rgba(180,30,30,0.94); color: #ffd;
      padding: 10px 18px; border-radius: 6px; font-size: 11.5px;
      text-align: center; line-height: 1.55; max-width: 460px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    #api-key-notice code {
      background: rgba(255,255,255,0.15); padding: 1px 5px;
      border-radius: 3px; font-size: 11px;
    }

    /* ── Coordinate Entry Toolbar ─────────────────────────── */
    #coord-toolbar {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      z-index: 15; background: rgba(22,27,34,0.96);
      border: 1px solid #30363d; border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      min-width: 320px; max-width: 520px;
    }
    #coord-icon { font-size: 14px; flex-shrink: 0; color: #58a6ff; }
    #coord-input {
      flex: 1; padding: 4px 8px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 4px;
      color: #e6edf3; font-size: 11.5px; outline: none; min-width: 0;
    }
    #coord-input:focus { border-color: #388bfd; }
    #coord-input.error { border-color: #f85149; }
    #coord-go {
      padding: 4px 10px; background: #1c3a5e; color: #58a6ff;
      border: 1px solid #388bfd; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
    }
    #coord-go:hover { background: #0d3750; }
    #coord-place {
      padding: 4px 10px; background: #1f4a2e; color: #3fb950;
      border: 1px solid #3fb950; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
      display: none;
    }
    #coord-place:hover { background: rgba(63,185,80,0.15); }
    #coord-close {
      background: none; border: none; color: #484f58; cursor: pointer;
      font-size: 16px; line-height: 1; padding: 2px 4px; flex-shrink: 0;
    }
    #coord-close:hover { color: #e6edf3; }
    #coord-crosshair {
      position: absolute; pointer-events: none;
      transition: opacity 0.6s ease; opacity: 0;
    }

    /* ── Attribute Panel (right side) ─────────────────────── */
    #attr-panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 280px; z-index: 12;
      background: #161b22; border-left: 1px solid #30363d;
      display: flex; flex-direction: column;
      transform: translateX(100%); transition: transform 0.14s ease-out;
      overflow: hidden;
    }
    #attr-panel.open { transform: translateX(0); }

    #attr-header {
      background: #0d3750; padding: 10px 12px;
      border-bottom: 1px solid #1f6f8b; display: flex;
      align-items: center; gap: 10px; flex-shrink: 0;
    }
    #attr-symbol-icon { flex-shrink: 0; }
    #attr-symbol-name {
      flex: 1; font-size: 12px; font-weight: 700; color: #79c0ff;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #attr-close {
      background: none; border: none; color: #8b949e; cursor: pointer;
      font-size: 18px; line-height: 1; padding: 2px;
    }
    #attr-close:hover { color: #e6edf3; }

    #attr-body {
      flex: 1; overflow-y: auto; padding: 10px;
      scrollbar-width: thin; scrollbar-color: #30363d #161b22;
    }
    #attr-body::-webkit-scrollbar { width: 5px; }
    #attr-body::-webkit-scrollbar-track { background: #161b22; }
    #attr-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

    .attr-section-header {
      font-size: 9px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: #484f58; padding: 8px 0 4px;
      border-bottom: 1px solid #21262d; margin-bottom: 8px;
    }

    .attr-field { margin-bottom: 10px; }
    .attr-label {
      font-size: 10px; color: #8b949e; margin-bottom: 4px; display: block;
    }
    .attr-input, .attr-select {
      width: 100%; padding: 5px 8px; background: #0d1117;
      border: 1px solid #30363d; border-radius: 4px;
      color: #e6edf3; font-size: 12px; outline: none;
    }
    .attr-input:focus, .attr-select:focus { border-color: #388bfd; }
    .attr-select { cursor: pointer; }

    .attr-radio-group { display: flex; gap: 8px; }
    .attr-radio-label {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: #c9d1d9; cursor: pointer;
    }
    .attr-radio-label input { accent-color: #388bfd; cursor: pointer; }

    .attr-checkbox-group { display: flex; flex-direction: column; gap: 6px; }
    .attr-check-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 11px; color: #c9d1d9; cursor: pointer;
    }
    .attr-check-label input { accent-color: #388bfd; cursor: pointer; }

    #attr-footer {
      padding: 10px 12px; border-top: 1px solid #30363d;
      display: flex; gap: 8px; flex-shrink: 0;
    }
    #attr-btn-remove {
      flex: 1; padding: 7px; background: none; color: #f85149;
      border: 1px solid #f85149; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600;
    }
    #attr-btn-remove:hover { background: rgba(248,81,73,0.1); }
    #attr-btn-close {
      padding: 7px 14px; background: #21262d; color: #8b949e;
      border: 1px solid #30363d; border-radius: 4px; cursor: pointer;
      font-size: 11px; font-weight: 600;
    }
    #attr-btn-close:hover { color: #e6edf3; }

    /* sidc read-only display */
    #attr-sidc-display {
      font-family: 'Courier New', monospace; font-size: 10px;
      color: #484f58; word-break: break-all; line-height: 1.5;
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <div id="sidebar">
    <div id="sidebar-header">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="18" height="18" rx="2" stroke="#79c0ff" stroke-width="1.5"/>
        <path d="M10 4v12M4 10h12" stroke="#79c0ff" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <h1>MIL-STD-2525</h1>
    </div>

    <div id="mode-tabs">
      <button class="mode-tab active" data-mode="units">Units</button>
      <button class="mode-tab"        data-mode="graphics">Graphics</button>
      <button class="mode-tab"        data-mode="objects">Objects</button>
    </div>

    <!-- Units panel -->
    <div id="units-panel" class="panel active">
      <div class="affil-tabs" id="unit-affil-tabs">
        <button class="tab-btn active" data-affil="F">Friendly</button>
        <button class="tab-btn"        data-affil="H">Hostile</button>
        <button class="tab-btn"        data-affil="N">Neutral</button>
        <button class="tab-btn"        data-affil="U">Unknown</button>
      </div>
      <!-- Recently used strip -->
      <div id="recently-used-wrap">
        <div id="recently-used-label">Recently Used</div>
        <div id="recently-used-strip"></div>
      </div>
      <!-- Search bar -->
      <div id="unit-search-wrap">
        <input type="text" id="unit-search" placeholder="Filter symbols…" autocomplete="off">
        <button id="unit-search-clear" title="Clear search">×</button>
      </div>
      <div class="palette" id="unit-palette"></div>
    </div>

    <!-- Graphics panel -->
    <div id="graphics-panel" class="panel">
      <div class="affil-tabs" id="tg-affil-tabs">
        <button class="tab-btn active" data-affil="F">Friendly</button>
        <button class="tab-btn"        data-affil="H">Hostile</button>
        <button class="tab-btn"        data-affil="N">Neutral</button>
        <button class="tab-btn"        data-affil="U">Unknown</button>
      </div>
      <div class="palette" id="tg-palette"></div>
    </div>

    <!-- Objects panel -->
    <div id="objects-panel">
      <div id="objects-list"></div>
      <div id="objects-footer">
        <button id="btn-export-geojson">Export GeoJSON</button>
        <span id="objects-total"></span>
      </div>
    </div>

    <div id="sidebar-footer" style="line-height:1.5">
      Units: drag to map &nbsp;·&nbsp; Graphics: click to draw
    </div>
  </div>

  <!-- ── Map ───────────────────────────────────────────── -->
  <div id="map-wrap">
    <div id="map"></div>

    <!-- Coordinate entry toolbar -->
    <div id="coord-toolbar">
      <span id="coord-icon">📍</span>
      <input type="text" id="coord-input" placeholder="lat, lng  e.g. 36.8500, -76.2900" autocomplete="off">
      <button id="coord-go">Go</button>
      <button id="coord-place">Place Here</button>

<script>

// ═══════════════════════════════════════════════════════════════
// NATO affiliation colours
// ═══════════════════════════════════════════════════════════════
const AFFIL_COLOR = { F: '#004B87', H: '#C8102E', N: '#006B3F', U: '#BF8B00' };
// Display colours for dots
const AFFIL_DOT   = { F: '#3fb950', H: '#f85149', N: '#d29922', U: '#a5d6ff' };

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let map         = null;
let unitAffil   = 'F';
let tgAffil     = 'F';
let dragSidc    = null;
let dragLabel   = null;
let dragDefSidc = null; // base template sidc for recently-used tracking
let uidCounter  = 0;
const placedUnits = [];
const placedTGs   = [];

// Per-unit modifiers (uid → modifiers object)
const unitModifiers = {};

// Currently open attribute panel
let attrPanelUid = null;

// Drawing state
const drw = {
  active:   false,
  def:      null,
  affil:    'F',
  points:   [],
  preview:  null,
  previewClose: null,
  dotMarkers:   [],
  listeners:    [],
};

let selectedTGEl = null;  // currently highlighted palette item

// Recently used: array of { sidc, label } (max 8)
const RECENT_KEY = 'milOverlay_recentUnits';
function loadRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || '[]'); } catch(_) { return []; }
}
function saveRecent(arr) {
  try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr)); } catch(_) {}
}
function addRecent(sidc, label) {
  let arr = loadRecent();
  arr = arr.filter(r => r.sidc !== sidc);
  arr.unshift({ sidc, label });
  if (arr.length > 8) arr.length = 8;
  saveRecent(arr);
  buildRecentStrip();
}

// ═══════════════════════════════════════════════════════════════
// RECENTLY USED STRIP
// ═══════════════════════════════════════════════════════════════
function buildRecentStrip() {
  const strip = document.getElementById('recently-used-strip');
  strip.innerHTML = '';
  const arr = loadRecent();
  if (arr.length === 0) {
    strip.parentElement.style.display = 'none';
    return;
  }
  strip.parentElement.style.display = '';
  arr.forEach(({ sidc, label }) => {
    const affilSidc = sidc.replace('$', unitAffil);
    let svgHtml = '';
    try { svgHtml = new ms.Symbol(affilSidc, { size: 26 }).asSVG(); } catch(_) {}
    const item = document.createElement('div');
    item.className = 'recent-item';
    item.title = label;
    const iconDiv = document.createElement('div');
    iconDiv.innerHTML = svgHtml;
    const nameSpan = document.createElement('span');
    nameSpan.textContent = label;
    item.appendChild(iconDiv);
    item.appendChild(nameSpan);
    item.addEventListener('click', () => {
      dragSidc    = affilSidc;
      dragLabel   = label;
      dragDefSidc = sidc;
      // Activate drop zone on click for keyboard / recent usage
      // Just set vars so user can drag or use "Place Here"
    });
    item.addEventListener('dragstart', e => {
      dragSidc  = affilSidc;
      dragLabel = label;
      dragDefSidc = sidc;
      item.style.opacity = '0.4';
      document.getElementById('drop-zone').classList.add('active');
      e.dataTransfer.effectAllowed = 'copy';
      const svgEl = item.querySelector('svg');
      if (svgEl) e.dataTransfer.setDragImage(svgEl,
        svgEl.width.baseVal.value / 2, svgEl.height.baseVal.value / 2);
    });
    item.addEventListener('dragend', () => {
      item.style.opacity = '';
      document.getElementById('drop-zone').classList.remove('active');
    });
    item.draggable = true;
    strip.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════════════
// UNIT PALETTE WITH SEARCH
// ═══════════════════════════════════════════════════════════════
function buildUnitPalette(affil, filter) {
  const container = document.getElementById('unit-palette');
  container.innerHTML = '';
  const q = (filter || '').toLowerCase().trim();

  let currentCatEl = null;
  let currentCatHasItems = false;

  function flushCat() {
    if (currentCatEl && !currentCatHasItems) {
      container.removeChild(currentCatEl);
    }
    currentCatEl = null;
    currentCatHasItems = false;
  }

  UNIT_DEFS.forEach(def => {
    if (def.cat) {
      flushCat();
      const el = document.createElement('div');
      el.className = 'cat-label';
      el.textContent = def.cat;
      container.appendChild(el);
      currentCatEl = el;
      currentCatHasItems = false;
      return;
    }

    if (q && !def.label.toLowerCase().includes(q)) return;
    currentCatHasItems = true;

    const sidc = def.sidc.replace('$', affil);
    let svgHtml = '<svg width="36" height="36"></svg>';
    try { svgHtml = new ms.Symbol(sidc, { size: 36 }).asSVG(); } catch (_) {}

    const item = document.createElement('div');
    item.className = 'sym-item';
    item.draggable = true;

    const iconDiv = document.createElement('div');
    iconDiv.className = 'item-icon';
    iconDiv.innerHTML = svgHtml;
    const nameSpan = document.createElement('span');
    nameSpan.className = 'item-name';
    nameSpan.textContent = def.label;
    item.appendChild(iconDiv);
    item.appendChild(nameSpan);

    item.addEventListener('dragstart', e => {
      dragSidc  = sidc;
      dragLabel = def.label;
      dragDefSidc = def.sidc;
      item.classList.add('dragging');
      document.getElementById('drop-zone').classList.add('active');
      e.dataTransfer.effectAllowed = 'copy';
      const svgEl = item.querySelector('svg');
      if (svgEl) e.dataTransfer.setDragImage(svgEl,
        svgEl.width.baseVal.value / 2, svgEl.height.baseVal.value / 2);
    });

    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
      document.getElementById('drop-zone').classList.remove('active');
    });

    container.appendChild(item);
  });
  flushCat();
}

// Search event wiring
document.getElementById('unit-search').addEventListener('input', function() {
  buildUnitPalette(unitAffil, this.value);
});
document.getElementById('unit-search-clear').addEventListener('click', () => {

document.getElementById('unit-search').addEventListener('keydown', e => {

// ═══════════════════════════════════════════════════════════════
// TACTICAL GRAPHIC PALETTE
// ═══════════════════════════════════════════════════════════════
function tgPaletteIcon(def, affil) {
  const c = def.forceColor || AFFIL_COLOR[affil];

  if (def.type === 'point') {
    const sidc = (def.sidc || '').replace('$', affil);
    try {
      const svg = new ms.Symbol(sidc, { size: 34 }).asSVG();
      if (svg && svg.includes('<path')) return svg;
    } catch (_) {}
    return `<svg width="34" height="34" viewBox="0 0 34 34">
      <circle cx="17" cy="17" r="13" stroke="${c}" stroke-width="2" fill="none"/>
      <text x="17" y="21" font-size="9" fill="${c}" text-anchor="middle" font-weight="700">${def.abbr}</text>
    </svg>`;
  }

  if (def.type === 'line') {
    const dash = def.dash ? `stroke-dasharray="${def.dash.join(',')}"` : '';
    const x2   = def.arrow ? 30 : 42;
    return `<svg width="46" height="22" viewBox="0 0 46 22">
      <line x1="2" y1="11" x2="${x2}" y2="11" stroke="${c}" stroke-width="2.5" ${dash}/>
      ${def.arrow ? `<polygon points="45,11 31,6 31,16" fill="${c}"/>` : ''}
      ${def.abbr ? `<text x="23" y="9" font-size="7" fill="${c}" text-anchor="middle" font-weight="700">${def.abbr}</text>` : ''}
    </svg>`;
  }

  if (def.type === 'area') {
    const dash = def.dash ? `stroke-dasharray="${def.dash.join(',')}"` : '';
    return `<svg width="46" height="30" viewBox="0 0 46 30">
      <polygon points="4,27 23,3 42,27" stroke="${c}" stroke-width="2" ${dash} fill="${c}" fill-opacity="0.2"/>
      ${def.abbr ? `<text x="23" y="22" font-size="7" fill="${c}" text-anchor="middle" font-weight="700">${def.abbr}</text>` : ''}
    </svg>`;
  }
  return '<svg width="34" height="34"></svg>';
}

function buildTGPalette(affil) {
  const container = document.getElementById('tg-palette');
  container.innerHTML = '';
  selectedTGEl = null;
  cancelDrawing();

  TG_DEFS.forEach(def => {
    if (def.cat) {
      const el = document.createElement('div');
      el.className = 'cat-label';
      el.textContent = def.cat;
      container.appendChild(el);
      return;
    }

    const badge   = { point: ['PT','badge-pt'], line: ['LN','badge-ln'], area: ['AR','badge-ar'] }[def.type];
    const item    = document.createElement('div');
    item.className = 'tg-item';
    const iconDiv = document.createElement('div');
    iconDiv.className = 'item-icon';
    iconDiv.innerHTML = tgPaletteIcon(def, affil);
    const nameSpan = document.createElement('span');
    nameSpan.className = 'item-name';
    nameSpan.textContent = def.label;
    const badgeSpan = document.createElement('span');
    badgeSpan.className = 'type-badge ' + badge[1];
    badgeSpan.textContent = badge[0];
    item.appendChild(iconDiv);
    item.appendChild(nameSpan);
    item.appendChild(badgeSpan);

    item.addEventListener('click', () => {
      if (selectedTGEl === item) { cancelDrawing(); return; }
      if (selectedTGEl) selectedTGEl.classList.remove('selected');
      selectedTGEl = item;
      item.classList.add('selected');
      startDrawing(def, affil);
    });

    container.appendChild(item);
  });
}

// ═══════════════════════════════════════════════════════════════
// DRAWING ENGINE
// ═══════════════════════════════════════════════════════════════
function startDrawing(def, affil) {
  cancelDrawing();
  drw.active = true;
  drw.def    = def;
  drw.affil  = affil;
  drw.points = [];

  const bar = document.getElementById('drawing-bar');
  document.getElementById('drawing-title').textContent = def.label;
  map.setOptions({ draggableCursor: 'crosshair' });

  if (def.type === 'point') {
    document.getElementById('drawing-hint').textContent = 'Click the map to place';
    document.getElementById('btn-undo').style.display   = 'none';
    document.getElementById('btn-finish').style.display = 'none';
    bar.classList.add('active');
    drw.listeners.push(map.addListener('click', e => {
      drw.listeners.forEach(l => google.maps.event.removeListener(l));
      drw.listeners.length = 0;
      const latLng = e.latLng;
      drw.active = false; drw.def = null; drw.points = [];
      bar.classList.remove('active');
      map.setOptions({ draggableCursor: null });
      openNameModal(def.label, def.abbr, name => placeTGPoint(latLng, def, affil, name));
    }));

  } else {
    const minPts = def.type === 'line' ? 2 : 3;
    document.getElementById('drawing-hint').textContent =
      `Click to add points · Double-click to finish (min ${minPts}) · Esc to cancel`;
    document.getElementById('btn-undo').style.display   = '';
    document.getElementById('btn-finish').style.display = '';
    bar.classList.add('active');

    const color = def.forceColor || AFFIL_COLOR[affil];

    drw.listeners.push(map.addListener('click',     e => addDrawPoint(e.latLng, color, def)));
    drw.listeners.push(map.addListener('mousemove', e => updatePreview(e.latLng, color, def)));
    drw.listeners.push(map.addListener('dblclick',  e => {
      if (drw.points.length > 0) {
        drw.dotMarkers[drw.dotMarkers.length - 1].setMap(null);
        drw.dotMarkers.pop();
        drw.points.pop();
      }
      commitDrawing();
    }));
  }
}

function addDrawPoint(latLng, color, def) {
  drw.points.push(latLng);
  const dot = new google.maps.Marker({
    position: latLng, map,
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 4,
            fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 1 },
    clickable: false, zIndex: 1000,
  });
  drw.dotMarkers.push(dot);
}

function updatePreview(cursorLatLng, color, def) {
  if (drw.points.length === 0) return;
  const path = [...drw.points, cursorLatLng];

  if (!drw.preview) {
    drw.preview = new google.maps.Polyline({
      map, path, strokeColor: color, strokeWeight: def.weight || 2,
      strokeOpacity: 0.65, clickable: false, geodesic: true, zIndex: 50,
    });
  } else {
    drw.preview.setPath(path);
  }

  if (def.type === 'area' && drw.points.length >= 2) {
    const closePath = [cursorLatLng, drw.points[0]];
    if (!drw.previewClose) {
      drw.previewClose = new google.maps.Polyline({
        map, path: closePath, strokeColor: color, strokeWeight: 1,
        strokeOpacity: 0.3, clickable: false, geodesic: true, zIndex: 50,
      });
    } else {
      drw.previewClose.setPath(closePath);
    }
  }
}

function clearDrawOverlays() {
  if (drw.preview)      { drw.preview.setMap(null);      drw.preview = null; }
  if (drw.previewClose) { drw.previewClose.setMap(null); drw.previewClose = null; }
  drw.dotMarkers.forEach(m => m.setMap(null));
  drw.dotMarkers.length = 0;
  drw.listeners.forEach(l => google.maps.event.removeListener(l));
  drw.listeners.length = 0;
}

function cancelDrawing() {
  clearDrawOverlays();
  drw.active = false; drw.def = null; drw.points = [];
  document.getElementById('drawing-bar').classList.remove('active');
  if (map) map.setOptions({ draggableCursor: null });
  if (selectedTGEl) { selectedTGEl.classList.remove('selected'); selectedTGEl = null; }
}

function commitDrawing() {
  const def   = drw.def;
  const affil = drw.affil;
  const color = def.forceColor || AFFIL_COLOR[affil];
  const minPts = def.type === 'line' ? 2 : 3;

  if (drw.points.length < minPts) { cancelDrawing(); return; }

  const points = [...drw.points];
  clearDrawOverlays();
  drw.active = false; drw.def = null; drw.points = [];
  document.getElementById('drawing-bar').classList.remove('active');
  map.setOptions({ draggableCursor: null });
  if (selectedTGEl) { selectedTGEl.classList.remove('selected'); selectedTGEl = null; }

  openNameModal(def.label, def.abbr, name => {
    if (def.type === 'line') placeTGLine(points, def, color, name, affil);
    else                     placeTGArea(points, def, color, name, affil);
  });
}

document.getElementById('btn-undo').addEventListener('click', () => {
  if (drw.points.length === 0) return;
  drw.dotMarkers[drw.dotMarkers.length - 1].setMap(null);

  if (drw.preview) {
    if (drw.points.length === 0) { drw.preview.setMap(null); drw.preview = null; }
    else drw.preview.setPath(drw.points);
  }
});

// ═══════════════════════════════════════════════════════════════
// PLACEMENT: POINT TG
// ═══════════════════════════════════════════════════════════════
function placeTGPoint(latLng, def, affil, name) {
  const uid   = ++uidCounter;
  const color = def.forceColor || AFFIL_COLOR[affil];
  const sidc  = (def.sidc || '').replace('$', affil);
  const label = name || def.abbr || def.label;

  let iconCfg;
  try {
    const sym = new ms.Symbol(sidc, { size: 40 });
    const svg = sym.asSVG();
    if (svg && svg.includes('<path')) {
      const a = sym.getAnchor();
      iconCfg = { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
                  anchor: new google.maps.Point(a.x, a.y) };
    }
  } catch (_) {}

  if (!iconCfg) {
    iconCfg = {
      path: google.maps.SymbolPath.CIRCLE, scale: 11,
      fillColor: color, fillOpacity: 1, strokeColor: '#fff', strokeWeight: 2,
      labelOrigin: new google.maps.Point(0, 0),
    };
  }

  const marker = new google.maps.Marker({
    position: latLng, map, icon: iconCfg,
    label: iconCfg.url ? undefined : { text: def.abbr, color: '#fff', fontSize: '8px', fontWeight: '700' },
    title: label, draggable: true, zIndex: uid,
  });

  const iw = new google.maps.InfoWindow();
  function refreshIW() {
    const p = marker.getPosition();
    iw.setContent(buildTGInfoHtml(uid, label, def.label, p.lat().toFixed(6), p.lng().toFixed(6)));
  }
  marker.addListener('click', () => { refreshIW(); iw.open(map, marker); });
  marker.addListener('dragend', refreshIW);
  refreshIW();
  placedTGs.push({
    uid, marker, iw, label, defLabel: def.label, sidc,
    affil, tgType: 'point', visible: true
  });
  refreshObjectsPanel();
}

// ═══════════════════════════════════════════════════════════════
// PLACEMENT: LINE TG
// ═══════════════════════════════════════════════════════════════
function buildPolyIcons(def, color) {
  const icons = [];
  if (def.dash) {
    icons.push({
      icon: { path: 'M 0,-1 0,1', strokeOpacity: 1, strokeColor: color,
              scale: (def.weight || 2) + 1 },
      offset: '0',
      repeat: `${(def.dash[0] + def.dash[1]) * 2}px`,
    });
  }
  if (def.arrow) {
    icons.push({
      icon: { path: google.maps.SymbolPath.FORWARD_OPEN_ARROW,
              scale: 4, strokeColor: color, strokeWeight: 2, strokeOpacity: 1 },
      offset: '100%',
    });
  }
  return icons;
}

function midLatLng(points) {
  const m = Math.floor(points.length / 2);
  if (points.length % 2 === 1) return { lat: points[m].lat(), lng: points[m].lng() };
  return { lat: (points[m-1].lat() + points[m].lat()) / 2,
           lng: (points[m-1].lng() + points[m].lng()) / 2 };
}

function centroidLatLng(points) {
  return { lat: points.reduce((s,p) => s + p.lat(), 0) / points.length,
           lng: points.reduce((s,p) => s + p.lng(), 0) / points.length };
}

function labelMarker(position, text, color, zIndex) {
  return new google.maps.Marker({
    position, map,
    icon: { path: google.maps.SymbolPath.CIRCLE, scale: 0 },
    label: { text, color, fontSize: '12px', fontWeight: '700', fontFamily: 'Arial,sans-serif' },
    clickable: false, zIndex,
  });
}

function placeTGLine(points, def, color, name, affil) {
  const uid  = ++uidCounter;
  const disp = name || def.abbr || def.label;
  const icons = buildPolyIcons(def, color);

  const polyline = new google.maps.Polyline({
    map, path: points, geodesic: true,
    strokeColor: def.dash ? 'transparent' : color,
    strokeOpacity: def.dash ? 0 : 1,
    strokeWeight: def.weight || 2,
    icons, zIndex: uid,
  });

  const lm  = labelMarker(midLatLng(points), disp, color, uid + 1);
  const iw  = new google.maps.InfoWindow();
  const iwContent = buildTGInfoHtml(uid, disp, def.label, null, null);
  polyline.addListener('click', e => { iw.setContent(iwContent); iw.setPosition(e.latLng); iw.open(map); });

  placedTGs.push({
    uid, overlays: [polyline, lm], iw, label: disp,
    defLabel: def.label, affil: affil || tgAffil, tgType: 'line',
    def, color, points: points.map(p => ({ lat: p.lat(), lng: p.lng() })),
    visible: true
  });
  refreshObjectsPanel();
}

// ═══════════════════════════════════════════════════════════════
// PLACEMENT: AREA TG
// ═══════════════════════════════════════════════════════════════
function placeTGArea(points, def, color, name, affil) {
  const uid  = ++uidCounter;
  const disp = name || def.abbr || def.label;

  const polygon = new google.maps.Polygon({
    map, paths: points, geodesic: true,
    strokeColor: def.dash ? 'transparent' : color,
    strokeOpacity: def.dash ? 0 : 0.9,
    strokeWeight: 2, fillColor: color, fillOpacity: 0.1, zIndex: uid,
  });

  const overlays = [polygon];

  if (def.dash) {
    const border = new google.maps.Polyline({
      map, path: [...points, points[0]], geodesic: true,
      strokeColor: 'transparent', strokeOpacity: 0, strokeWeight: 2,
      icons: buildPolyIcons(def, color), zIndex: uid,
    });
    overlays.push(border);
  }

  const lm = labelMarker(centroidLatLng(points), disp, color, uid + 1);
  overlays.push(lm);

  const iw = new google.maps.InfoWindow();
  const iwContent = buildTGInfoHtml(uid, disp, def.label, null, null);
  polygon.addListener('click', e => { iw.setContent(iwContent); iw.setPosition(e.latLng); iw.open(map); });

  placedTGs.push({
    uid, overlays, iw, label: disp,
    defLabel: def.label, affil: affil || tgAffil, tgType: 'area',
    def, color, points: points.map(p => ({ lat: p.lat(), lng: p.lng() })),
    visible: true
  });
  refreshObjectsPanel();
}

// ═══════════════════════════════════════════════════════════════
// TG INFO HTML (safe, no onclick XSS)
// ═══════════════════════════════════════════════════════════════
function buildTGInfoHtml(uid, title, subtitle, lat, lng) {
  const box = document.createElement('div');
  box.style.cssText = 'font-family:Arial,sans-serif;min-width:160px;padding:2px 0';

  const titleEl = document.createElement('div');
  titleEl.style.cssText = 'font-weight:700;font-size:13px;margin-bottom:3px';
  titleEl.textContent = title;
  box.appendChild(titleEl);

  const subEl = document.createElement('div');
  subEl.style.cssText = 'font-size:10px;color:#888;margin-bottom:7px';
  subEl.textContent = subtitle;
  box.appendChild(subEl);

  if (lat != null) {
    const latEl = document.createElement('div');
    latEl.style.cssText = 'font-size:11px;margin-bottom:1px';
    latEl.textContent = 'Lat: ' + lat;
    box.appendChild(latEl);
    const lngEl = document.createElement('div');
    lngEl.style.cssText = 'font-size:11px;margin-bottom:9px';
    lngEl.textContent = 'Lng: ' + lng;
    box.appendChild(lngEl);
  } else {
    const sp = document.createElement('div');
    sp.style.marginBottom = '9px';
    box.appendChild(sp);
  }

  const btn = document.createElement('button');
  btn.style.cssText = 'padding:4px 12px;background:#d73a49;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:11px;font-weight:600';
  btn.textContent = 'Remove';
  btn.addEventListener('click', () => removeTG(uid));
  box.appendChild(btn);
  return box;
}

// REMOVE HANDLERS
// ═══════════════════════════════════════════════════════════════
function removeUnit(uid) {
  const idx = placedUnits.findIndex(m => m.uid === uid);
  if (idx < 0) return;
  if (placedUnits[idx].iw) placedUnits[idx].iw.close();
  placedUnits[idx].marker.setMap(null);
  placedUnits.splice(idx, 1);
  delete unitModifiers[uid];
  if (attrPanelUid === uid) closeAttrPanel();
  refreshObjectsPanel();
}

function removeTG(uid) {
  const idx = placedTGs.findIndex(t => t.uid === uid);
  if (idx < 0) return;
  if (placedTGs[idx].iw) placedTGs[idx].iw.close();
  if (placedTGs[idx].marker)   placedTGs[idx].marker.setMap(null);
  if (placedTGs[idx].overlays) placedTGs[idx].overlays.forEach(o => o.setMap(null));
  placedTGs.splice(idx, 1);
  refreshObjectsPanel();
}

// ═══════════════════════════════════════════════════════════════
// UNIT DRAG-DROP
// ═══════════════════════════════════════════════════════════════
function clientXYtoLatLng(clientX, clientY) {
  const d = map.getDiv(), r = d.getBoundingClientRect();
  const proj = map.getProjection(), scale = Math.pow(2, map.getZoom());
  const c = proj.fromLatLngToPoint(map.getCenter());
  return proj.fromPointToLatLng(new google.maps.Point(
    c.x + (clientX - r.left  - d.offsetWidth  / 2) / scale,
    c.y + (clientY - r.top   - d.offsetHeight / 2) / scale
  ));
}

function placeUnitMarker(latLng, sidc, label) {
  const uid = ++uidCounter;
  const mods = {
    status: 'P', echelon: '', taskForce: false,
    headquartersElement: false, feintDummy: false,
    reinforcedReduced: '', uniqueDesignation: '',
    higherFormation: '', additionalInformation: '',
    directionOfMovement: '', speed: ''
  };
  unitModifiers[uid] = mods;

  const marker = buildUnitMarkerIcon(uid, sidc, label, latLng, mods);
  placedUnits.push({ uid, marker, sidc, label, visible: true });

  // Track recently used
  addRecent(sidc.replace(/[FHNU]/, '$'), label);

  marker.addListener('click', () => openAttrPanel(uid));
  refreshObjectsPanel();
  return marker;
}

function buildUnitMarkerIcon(uid, sidc, label, latLng, mods) {
  // Build the effective SIDC with status character
  let effectiveSidc = sidc;
  if (mods.status && effectiveSidc.length >= 4) {
    effectiveSidc = effectiveSidc.slice(0, 3) + mods.status + effectiveSidc.slice(4);
  }

  const symOptions = { size: 44 };
  if (mods.echelon)              symOptions.echelon              = mods.echelon;
  if (mods.taskForce)            symOptions.taskForce            = true;
  if (mods.headquartersElement)  symOptions.headquartersElement  = true;
  if (mods.feintDummy)           symOptions.feintDummy           = true;
  if (mods.reinforcedReduced)    symOptions.reinforcedReduced    = mods.reinforcedReduced;
  if (mods.uniqueDesignation)    symOptions.uniqueDesignation    = mods.uniqueDesignation;
  if (mods.higherFormation)      symOptions.higherFormation      = mods.higherFormation;
  if (mods.additionalInformation) symOptions.additionalInformation = mods.additionalInformation;
  if (mods.directionOfMovement !== '' && mods.directionOfMovement !== null && mods.directionOfMovement !== undefined) {
    const d = Number(mods.directionOfMovement);
    if (!isNaN(d)) symOptions.directionOfMovement = d;
  }
  if (mods.speed !== '' && mods.speed !== null && mods.speed !== undefined) {
    const s = Number(mods.speed);
    if (!isNaN(s)) symOptions.speed = s;
  }

  const sym = new ms.Symbol(effectiveSidc, symOptions);
  const anc = sym.getAnchor();
  return new google.maps.Marker({
    position: latLng, map,
    icon: { url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(sym.asSVG()),
            anchor: new google.maps.Point(anc.x, anc.y) },
    title: label, draggable: true, zIndex: uid,
  });
}

function reRenderUnitMarker(uid) {
  const rec = placedUnits.find(u => u.uid === uid);
  if (!rec || !map) return;
  const mods = unitModifiers[uid] || {};
  const pos = rec.marker.getPosition();

  // Build effective SIDC
  let effectiveSidc = rec.sidc;
  if (mods.status && effectiveSidc.length >= 4) {
    effectiveSidc = effectiveSidc.slice(0, 3) + mods.status + effectiveSidc.slice(4);
  }

  const symOptions = { size: 44 };
  if (mods.echelon)              symOptions.echelon              = mods.echelon;
  if (mods.taskForce)            symOptions.taskForce            = true;
  if (mods.headquartersElement)  symOptions.headquartersElement  = true;
  if (mods.feintDummy)           symOptions.feintDummy           = true;
  if (mods.reinforcedReduced)    symOptions.reinforcedReduced    = mods.reinforcedReduced;
  if (mods.uniqueDesignation)    symOptions.uniqueDesignation    = mods.uniqueDesignation;
  if (mods.higherFormation)      symOptions.higherFormation      = mods.higherFormation;
  if (mods.additionalInformation) symOptions.additionalInformation = mods.additionalInformation;
  if (mods.directionOfMovement !== '' && mods.directionOfMovement !== null && mods.directionOfMovement !== undefined) {
    const d = Number(mods.directionOfMovement);
    if (!isNaN(d)) symOptions.directionOfMovement = d;
  }
  if (mods.speed !== '' && mods.speed !== null && mods.speed !== undefined) {
    const s = Number(mods.speed);
    if (!isNaN(s)) symOptions.speed = s;
  }

  try {
    const sym = new ms.Symbol(effectiveSidc, symOptions);
    const anc = sym.getAnchor();
    rec.marker.setIcon({
      url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(sym.asSVG()),
      anchor: new google.maps.Point(anc.x, anc.y)
    });
  } catch(_) {}

  // Update SIDC display in panel
  if (attrPanelUid === uid) {
    const el = document.getElementById('attr-sidc-display');
    if (el) el.textContent = 'SIDC: ' + effectiveSidc;
  }
}

dropZone.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
dropZone.addEventListener('drop', e => {

// ═══════════════════════════════════════════════════════════════
// SYMBOL ATTRIBUTE PANEL
// ═══════════════════════════════════════════════════════════════
function openAttrPanel(uid) {
  const rec = placedUnits.find(u => u.uid === uid);
  if (!rec) return;
  attrPanelUid = uid;

  const mods = unitModifiers[uid] || {};

  // Header
  document.getElementById('attr-symbol-name').textContent = rec.label;

  // Render miniature icon in header
  const iconEl = document.getElementById('attr-symbol-icon');
  try {
    const sym = new ms.Symbol(rec.sidc, { size: 32 });
    iconEl.innerHTML = sym.asSVG();
  } catch(_) { iconEl.innerHTML = ''; }

  // Populate fields (suppress re-render during population)
  const suppressFlag = { val: true };

  document.querySelectorAll('input[name="attr-status"]').forEach(r => {
    r.checked = (r.value === (mods.status || 'P'));
  });

  document.getElementById('attr-echelon').value       = mods.echelon || '';
  document.getElementById('attr-taskforce').checked   = !!mods.taskForce;
  document.getElementById('attr-hq').checked          = !!mods.headquartersElement;
  document.getElementById('attr-feint').checked       = !!mods.feintDummy;
  document.getElementById('attr-reinf').value         = mods.reinforcedReduced || '';
  document.getElementById('attr-desig').value         = mods.uniqueDesignation || '';
  document.getElementById('attr-higher').value        = mods.higherFormation || '';
  document.getElementById('attr-addlinfo').value      = mods.additionalInformation || '';
  document.getElementById('attr-dom').value           = mods.directionOfMovement !== undefined && mods.directionOfMovement !== '' ? mods.directionOfMovement : '';
  document.getElementById('attr-speed').value         = mods.speed !== undefined && mods.speed !== '' ? mods.speed : '';

  // SIDC read-only
  let effectiveSidc = rec.sidc;
  if (mods.status && effectiveSidc.length >= 4) {
    effectiveSidc = effectiveSidc.slice(0, 3) + mods.status + effectiveSidc.slice(4);
  }
  document.getElementById('attr-sidc-display').textContent = 'SIDC: ' + effectiveSidc;

  suppressFlag.val = false;

  // Store suppress on panel element to access in handlers
  document.getElementById('attr-panel').dataset.suppress = '0';

  document.getElementById('attr-panel').classList.add('open');
}

function closeAttrPanel() {
  document.getElementById('attr-panel').classList.remove('open');
  attrPanelUid = null;
}

function attrPanelChanged() {
  if (!attrPanelUid) return;
  const mods = unitModifiers[attrPanelUid];
  if (!mods) return;

  const statusEl = document.querySelector('input[name="attr-status"]:checked');
  mods.status               = statusEl ? statusEl.value : 'P';
  mods.echelon              = document.getElementById('attr-echelon').value;
  mods.taskForce            = document.getElementById('attr-taskforce').checked;
  mods.headquartersElement  = document.getElementById('attr-hq').checked;
  mods.feintDummy           = document.getElementById('attr-feint').checked;
  mods.reinforcedReduced    = document.getElementById('attr-reinf').value;
  mods.uniqueDesignation    = document.getElementById('attr-desig').value;
  mods.higherFormation      = document.getElementById('attr-higher').value;
  mods.additionalInformation = document.getElementById('attr-addlinfo').value;
  mods.directionOfMovement  = document.getElementById('attr-dom').value;
  mods.speed                = document.getElementById('attr-speed').value;

  reRenderUnitMarker(attrPanelUid);
}

// Wire all attr panel controls
['change', 'input'].forEach(evt => {

    el.addEventListener(evt, attrPanelChanged));
  document.getElementById('attr-echelon').addEventListener(evt, attrPanelChanged);
  document.getElementById('attr-taskforce').addEventListener(evt, attrPanelChanged);
  document.getElementById('attr-hq').addEventListener(evt, attrPanelChanged);

// ═══════════════════════════════════════════════════════════════
// OBJECT / LAYER MANAGER
// ═══════════════════════════════════════════════════════════════
const objGroupCollapse = {}; // groupKey → boolean (true = collapsed)

function refreshObjectsPanel() {
  const list = document.getElementById('objects-list');
  list.innerHTML = '';

  const groups = [
    { key: 'units',    title: 'Unit Symbols',             items: placedUnits, type: 'unit'    },
    { key: 'tg-point', title: 'Tactical Graphics — Points', items: placedTGs.filter(t => t.tgType === 'point'), type: 'tg-point' },
    { key: 'tg-line',  title: 'Tactical Graphics — Lines',  items: placedTGs.filter(t => t.tgType === 'line'),  type: 'tg-line'  },
    { key: 'tg-area',  title: 'Tactical Graphics — Areas',  items: placedTGs.filter(t => t.tgType === 'area'),  type: 'tg-area'  },
  ];

  let total = 0;

  groups.forEach(group => {
    total += group.items.length;
    const isCollapsed = !!objGroupCollapse[group.key];

    // Group header
    const hdr = document.createElement('div');
    hdr.className = 'obj-group-header';

    const tri = document.createElement('span');
    tri.className = 'obj-group-triangle';
    tri.textContent = isCollapsed ? '▸' : '▾';

    const titleEl = document.createElement('span');
    titleEl.className = 'obj-group-title';
    titleEl.textContent = group.title;

    const countEl = document.createElement('span');
    countEl.className = 'obj-group-count';
    countEl.textContent = group.items.length;

    const eyeBtn = document.createElement('button');
    eyeBtn.className = 'obj-group-eye';
    eyeBtn.title = 'Toggle group visibility';
    eyeBtn.textContent = '👁';
    eyeBtn.addEventListener('click', e => {
      e.stopPropagation();
      const anyVisible = group.items.some(it => it.visible);
      const newVis = !anyVisible;
      group.items.forEach(it => {
        it.visible = newVis;
        setObjectVisibility(it, group.type, newVis);
      });
      refreshObjectsPanel();
    });

    hdr.appendChild(tri);
    hdr.appendChild(titleEl);
    hdr.appendChild(countEl);
    hdr.appendChild(eyeBtn);

    const groupList = document.createElement('div');
    groupList.className = 'obj-group-list' + (isCollapsed ? ' collapsed' : '');
    groupList.style.maxHeight = isCollapsed ? '0' : (group.items.length * 34 + 4) + 'px';

    hdr.addEventListener('click', () => {
      objGroupCollapse[group.key] = !objGroupCollapse[group.key];
      refreshObjectsPanel();
    });

    list.appendChild(hdr);
    list.appendChild(groupList);

    // Rows
    group.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'obj-row' + (item.uid === attrPanelUid ? ' selected' : '');

      // Affiliation dot
      const dot = document.createElement('div');
      dot.className = 'obj-dot';
      dot.style.background = AFFIL_DOT[item.affil] || '#8b949e';

      // Type icon
      const typeIcon = document.createElement('span');
      typeIcon.className = 'obj-type-icon';
      if (group.type === 'unit')     typeIcon.textContent = '●';
      else if (group.type === 'tg-point') typeIcon.textContent = '◆';
      else if (group.type === 'tg-line')  typeIcon.textContent = '—';
      else if (group.type === 'tg-area')  typeIcon.textContent = '▭';

      // Name
      const nameEl = document.createElement('span');
      nameEl.className = 'obj-name' + (item.visible ? '' : ' hidden-obj');
      nameEl.textContent = item.label || '(unnamed)';

      // Visibility button
      const visBtn = document.createElement('button');
      visBtn.className = 'obj-btn';
      visBtn.title = item.visible ? 'Hide' : 'Show';
      visBtn.textContent = item.visible ? '👁' : '🚫';
      visBtn.addEventListener('click', e => {
        e.stopPropagation();
        item.visible = !item.visible;
        setObjectVisibility(item, group.type, item.visible);
        refreshObjectsPanel();
      });

      // Delete button
      const delBtn = document.createElement('button');
      delBtn.className = 'obj-btn del';
      delBtn.title = 'Delete';
      delBtn.textContent = '🗑';
      delBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (group.type === 'unit') removeUnit(item.uid);
        else removeTG(item.uid);
      });

      row.appendChild(dot);
      row.appendChild(typeIcon);
      row.appendChild(nameEl);
      row.appendChild(visBtn);
      row.appendChild(delBtn);

      // Click row → pan to object and open attr panel (units)
      row.addEventListener('click', () => {
        if (group.type === 'unit') {
          const pos = item.marker.getPosition();
          if (map) map.panTo(pos);
          openAttrPanel(item.uid);
          // Switch to objects tab stays, but highlight row
        } else {
          // Pan to TG
          if (item.marker) {
            map && map.panTo(item.marker.getPosition());
          } else if (item.overlays) {
            // Find first overlay with getPath/getPosition
            const poly = item.overlays[0];
            if (poly && poly.getPath) {
              const path = poly.getPath().getArray();
              if (path.length > 0) map && map.panTo(path[0]);
            }
          }
        }
      });

      groupList.appendChild(row);
    });
  });

  // Total
  document.getElementById('objects-total').textContent = 'Total: ' + total;
}

function setObjectVisibility(item, type, visible) {
  const mapTarget = visible ? map : null;
  if (type === 'unit') {
    item.marker.setMap(mapTarget);
  } else {
    if (item.marker) item.marker.setMap(mapTarget);
    if (item.overlays) item.overlays.forEach(o => o.setMap(mapTarget));
  }
}

// GEOJSON EXPORT
// ═══════════════════════════════════════════════════════════════
function escStr(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function buildGeoJSON() {
  const features = [];

  placedUnits.forEach(rec => {
    const pos = rec.marker.getPosition();
    const mods = unitModifiers[rec.uid] || {};
    features.push({
      type: 'Feature',
      geometry: {
        type: 'Point',
        coordinates: [parseFloat(pos.lng().toFixed(7)), parseFloat(pos.lat().toFixed(7))]
      },
      properties: {
        uid: rec.uid,
        objectType: 'unit',
        sidc: rec.sidc,
        label: rec.label,
        affiliation: rec.affil || 'F',
        visible: rec.visible,
        modifiers: {
          status:               mods.status || 'P',
          echelon:              mods.echelon || '',
          taskForce:            !!mods.taskForce,
          headquartersElement:  !!mods.headquartersElement,
          feintDummy:           !!mods.feintDummy,
          reinforcedReduced:    mods.reinforcedReduced || '',
          uniqueDesignation:    mods.uniqueDesignation || '',
          higherFormation:      mods.higherFormation || '',
          additionalInformation: mods.additionalInformation || '',
          directionOfMovement:  mods.directionOfMovement !== '' && mods.directionOfMovement !== undefined ? Number(mods.directionOfMovement) : null,
          speed:                mods.speed !== '' && mods.speed !== undefined ? Number(mods.speed) : null,
        }
      }
    });
  });

  placedTGs.forEach(tg => {
    if (tg.tgType === 'point') {
      const pos = tg.marker.getPosition();
      features.push({
        type: 'Feature',
        geometry: {
          type: 'Point',
          coordinates: [parseFloat(pos.lng().toFixed(7)), parseFloat(pos.lat().toFixed(7))]
        },
        properties: {
          uid: tg.uid,
          objectType: 'tg-point',
          sidc: tg.sidc || null,
          label: tg.label,
          graphicType: tg.defLabel,
          affiliation: tg.affil || 'F',
          visible: tg.visible
        }
      });
    } else if (tg.tgType === 'line') {
      const poly = tg.overlays && tg.overlays[0];
      if (!poly) return;
      const coords = poly.getPath().getArray().map(p =>
        [parseFloat(p.lng().toFixed(7)), parseFloat(p.lat().toFixed(7))]);
      features.push({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: coords },
        properties: {
          uid: tg.uid,
          objectType: 'tg-line',
          sidc: tg.sidc || null,
          label: tg.label,
          graphicType: tg.defLabel,
          affiliation: tg.affil || 'F',
          visible: tg.visible
        }
      });
    } else if (tg.tgType === 'area') {
      const poly = tg.overlays && tg.overlays[0];
      if (!poly) return;
      const ring = poly.getPath().getArray().map(p =>
        [parseFloat(p.lng().toFixed(7)), parseFloat(p.lat().toFixed(7))]);
      // Close the ring
      if (ring.length > 0) ring.push(ring[0]);
      features.push({
        type: 'Feature',
        geometry: { type: 'Polygon', coordinates: [ring] },
        properties: {
          uid: tg.uid,
          objectType: 'tg-area',
          sidc: tg.sidc || null,
          label: tg.label,
          graphicType: tg.defLabel,
          affiliation: tg.affil || 'F',
          visible: tg.visible
        }
      });
    }
  });

  return {
    type: 'FeatureCollection',
    milOverlayVersion: '1.0',
    exportedAt: new Date().toISOString(),
    features
  };
}

function downloadGeoJSON() {
  const geojson = buildGeoJSON();
  const str = JSON.stringify(geojson, null, 2);
  const blob = new Blob([str], { type: 'application/geo+json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'military-map-export.geojson';
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); document.body.removeChild(a); }, 1000);
}

document.getElementById('btn-export-geojson').addEventListener('click', downloadGeoJSON);

// COORDINATE ENTRY TOOLBAR
// ═══════════════════════════════════════════════════════════════
let coordToolbarVisible = true;
let crosshairTimer = null;

document.getElementById('coord-close').addEventListener('click', () => {
  document.getElementById('coord-toolbar').style.display = 'none';
  coordToolbarVisible = false;
});

function parseLatLng(str) {
  str = str.trim();
  // Try "lat, lng" or "lat lng"
  const m = str.match(/^(-?\d+\.?\d*)\s*[,\s]\s*(-?\d+\.?\d*)$/);
  if (m) {
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if (lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
      return { lat, lng };
    }
  }
  return null;
}

function flyToCoord(latLng) {
  if (!map) return;
  map.panTo(latLng);
  if (map.getZoom() < 12) map.setZoom(14);
  else map.setZoom(14);
  showCrosshair(latLng);
}

function showCrosshair(latLng) {
  // Remove any existing
  const existing = document.getElementById('coord-crosshair-el');
  if (existing) existing.remove();
  if (crosshairTimer) clearTimeout(crosshairTimer);

  // We use an overlay div positioned by google maps OverlayView
  // Simpler: use a temporary marker with an SVG crosshair icon
  const crosshairSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
    <line x1="20" y1="0" x2="20" y2="40" stroke="#58a6ff" stroke-width="2" opacity="0.8"/>
    <line x1="0" y1="20" x2="40" y2="20" stroke="#58a6ff" stroke-width="2" opacity="0.8"/>
    <circle cx="20" cy="20" r="6" fill="none" stroke="#58a6ff" stroke-width="2" opacity="0.8"/>
  </svg>`;

  const chMarker = new google.maps.Marker({
    position: latLng, map,
    icon: {
      url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(crosshairSvg),
      anchor: new google.maps.Point(20, 20)
    },
    clickable: false, zIndex: 9999,
  });

  crosshairTimer = setTimeout(() => {
    chMarker.setMap(null);
  }, 2000);
}

function handleCoordGo() {
  const input = document.getElementById('coord-input');
  const val = input.value;
  const parsed = parseLatLng(val);
  if (!parsed) {
    input.classList.add('error');
    setTimeout(() => input.classList.remove('error'), 1500);
    return;
  }
  input.classList.remove('error');
  flyToCoord(parsed);
}

function handleCoordPlace() {
  const input = document.getElementById('coord-input');
  const val = input.value;
  const parsed = parseLatLng(val);
  if (!parsed || !dragSidc) return;
  if (!map) return;
  const latLng = new google.maps.LatLng(parsed.lat, parsed.lng);
  placeUnitMarker(latLng, dragSidc, dragLabel);
  dragSidc = dragLabel = null;
  updateCoordPlaceButton();
}

function updateCoordPlaceButton() {
  const btn = document.getElementById('coord-place');
  btn.style.display = dragSidc ? 'inline-block' : 'none';
}

document.getElementById('coord-go').addEventListener('click', handleCoordGo);
document.getElementById('coord-place').addEventListener('click', handleCoordPlace);
document.getElementById('coord-input').addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') handleCoordGo();
});

// Update "Place Here" button visibility when drag starts/ends
// Hook into drag events
document.addEventListener('dragstart', updateCoordPlaceButton);
document.addEventListener('dragend', updateCoordPlaceButton);

document.querySelectorAll('.mode-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Hide all panels
    document.querySelectorAll('#sidebar .panel').forEach(p => p.classList.remove('active'));
    document.getElementById('objects-panel').classList.remove('active');

    const mode = btn.dataset.mode;
    if (mode === 'units' || mode === 'graphics') {
      const panel = document.getElementById(mode + '-panel');
      panel.classList.add('active');
      if (mode === 'units') cancelDrawing();
    } else if (mode === 'objects') {
      document.getElementById('objects-panel').classList.add('active');
      refreshObjectsPanel();
    }
  });
});

document.querySelectorAll('#unit-affil-tabs .tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#unit-affil-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    unitAffil = btn.dataset.affil;
    buildUnitPalette(unitAffil, document.getElementById('unit-search').value);
    buildRecentStrip();
  });
});

document.querySelectorAll('#tg-affil-tabs .tab-btn').forEach(btn => {

    btn.classList.add('active');

  });
});

window.initMap = function () {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 36.85, lng: -76.29 }, zoom: 11,
    mapTypeId: 'terrain', gestureHandling: 'greedy',
    mapTypeControl: true, streetViewControl: false, fullscreenControl: true,
    mapTypeControlOptions: {
      style: google.maps.MapTypeControlStyle.HORIZONTAL_BAR,
      position: google.maps.ControlPosition.TOP_RIGHT,
    },
  });

  // Close attr panel on empty map click
  map.addListener('click', (e) => {
    // Only close if click didn't hit a marker (markers stopPropagation by default in Maps)
    closeAttrPanel();
  });

  buildUnitPalette('F');
  buildTGPalette('F');
  buildRecentStrip();
  refreshObjectsPanel();
};
